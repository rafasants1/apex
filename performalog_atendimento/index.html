/* ---------- simulador do cliente ---------- */
function renderSim(){
  document.body.classList.toggle("sim-open",S.simOpen);
  const el=$("#sim"); el.hidden=!S.simOpen; $("#simbtn").textContent=S.simOpen?"Fechar simulador":"Simular cliente";
  if(!S.simOpen) return;
  keepFocus(()=>{
  const c=contato(S.simC), wa=c.wa_id||Object.values(META.users).find(u=>u.input===digits(c))?.wa_id||digits(c), u=META.users[wa];
  const dev=META.device[wa]||[];
  const bubble=x=>{
    if(x.dir==="me") return `<div class="sb me"><div class="bub">${esc(x.text)}</div><small>${hhmm(x.ts)}</small></div>`;
    const b=x.body; let inner="",after="";
    if(b.type==="text") inner=esc(b.text.body);
    if(b.type==="image"||b.type==="document") inner=`<span class="hd">[${b.type==="image"?"Imagem":"Documento"}] ${esc(b[b.type].filename||"")}</span>${esc(b[b.type].caption||"")}`;
    if(b.type==="interactive"){inner=esc(b.interactive.body.text);
      if(b.interactive.type==="button") after=b.interactive.action.buttons.map(bt=>`<button class="wa-btn" data-r="button_reply" data-id="${esc(bt.reply.id)}" data-t="${esc(bt.reply.title)}" data-ctx="${x.id}">${esc(bt.reply.title)}</button>`).join("");
      if(b.interactive.type==="list") after=`<div class="sim-list"><span class="muted small" style="padding:4px 8px">${esc(b.interactive.action.button)}</span>${b.interactive.action.sections[0].rows.map(r=>`<button data-r="list_reply" data-id="${esc(r.id)}" data-t="${esc(r.title)}" data-d="${esc(r.description)}" data-ctx="${x.id}"><b>${esc(r.title)}</b><small class="muted">${esc(r.description)}</small></button>`).join("")}</div>`}
    if(b.type==="template"){const t=META.tpls[b.template.name];const ps=(b.template.components.find(k=>k.type==="body")?.parameters||[]).map(p=>p.text);
      let tx=t.body;ps.forEach((p,i)=>tx=tx.split(`{{${i+1}}}`).join(p));
      inner=`${t.header?`<span class="hd">${esc(t.header)}</span>`:""}<span>${esc(tx)}</span>${t.footer?`<span class="ft">${esc(t.footer)}</span>`:""}`;
      after=b.template.components.filter(k=>k.type==="button").map(k=>`<button class="wa-btn" data-r="button" data-id="${esc(k.parameters[0].payload)}" data-t="${esc(t.buttons[+k.index])}" data-ctx="${x.id}">${esc(t.buttons[+k.index])}</button>`).join("")}
    return `<div class="sb biz"><div class="bub">${inner}</div>${after}<small>${hhmm(x.ts)}${b.type==="template"?" · template":""}</small></div>`;
  };
  const cv=convOf(c);
  const passo=cv&&cv.flow&&!cv.flow.done?FLOWS[cv.flow.flowId].nodes[cv.flow.node]:null;
  const stx=!cv||cv.status==="encerrada"?["p-mute","Sem atendimento aberto: a próxima mensagem abre um protocolo e a automação responde."]
    :cv.status==="bot"?["p-info",`Falando com a automação${passo?` · ${passo.titulo}`:""}${passo&&passo.tipo==="agente_cobranca"&&cv.agc?` · etapa: ${cv.agc.fase.replace(/_/g," ")}`:""}`]
    :cv.status==="fila"?["p-warn",`Na fila de ${cv.setor}: agora quem responde é uma pessoa. Para responder como atendente, entre como ${cv.setor==="Cobrança"?"Thiago":"Camila"} em Atendimento. Para testar o bot de novo, reinicie.`]
    :["p-ok",`Em atendimento com ${cv.agente}.`];
  el.innerHTML=`<div class="sim-h"><div class="row spread"><b style="font-family:var(--f-display)">Celular do cliente</b><span class="row" style="gap:4px"><button class="btn sm" id="simmail" title="Simula o cliente escrevendo por e-mail">Enviar e-mail</button><button class="btn ghost sm" id="simx">Fechar</button></span></div>
    <div class="row" style="flex-wrap:nowrap"><select id="simc" aria-label="Escolher contato" style="flex:1">${CONTATOS.map(k=>`<option value="${k.id}" ${k.id===c.id?"selected":""}>${esc(k.nome)}${k.wa===false?" · sem WhatsApp":""}${UCS[k.id]&&dividaDe(k).titulos.length?" · em atraso":""}</option>`).join("")}<option value="novo">+ Número novo (não cadastrado)</option></select><button class="btn sm" id="simreset" title="Volta este cliente ao estado inicial">Reiniciar</button></div>
    <div class="callout ${stx[0]==="p-warn"?"c-warn":stx[0]==="p-info"?"c-info":"c-mute"}" style="font-size:.78rem;padding:6px 8px">${esc(stx[1])}</div>
    <span class="small muted">${u?(windowOpen(u)?`<span class="pill p-ok">janela aberta</span> última msg do cliente ${hhmm(u.lastInbound)}`:""):""}</span></div>
   <div class="sim-msgs" data-keep-scroll="sim">${dev.length?dev.map(bubble).join(""):`<p class="empty small">Nada recebido ainda. Mande uma mensagem como se fosse o cliente: o webhook chega no backend e o bot responde.</p>`}</div>
   <div class="sim-f"><div class="chips">${["Oi","Quero negociar minha fatura","Consigo pagar dia 15","Não reconheço essa cobrança","[comprovante.pdf]","Vou no PROCON","SAIR"].map(q=>`<button data-q="${q}">${q}</button>`).join("")}</div>
    <div class="row"><input type="text" id="simtxt" placeholder="Mensagem do cliente" ${u&&u.hasWA?"":"disabled"}><button class="btn primary" id="simsend" ${u&&u.hasWA?"":"disabled"}>Enviar</button></div></div>`;
  const m=el.querySelector(".sim-msgs");
  $("#simx").onclick=()=>{S.simOpen=false;refresh()};
  $("#simmail").onclick=()=>{S.conOpen=true;emailRecebido(c);toast("E-mail recebido do cliente");refresh()};
  $("#simc").onchange=e=>{if(e.target.value==="novo"){S.simC=novoNumero();S.conOpen=true;refresh();return}S.simC=+e.target.value;renderSim()};
  $("#simreset").onclick=()=>{resetCliente(c.id);toast(`${c.nome}: simulação reiniciada`);refresh()};
  const send=t=>{if(!t.trim()||!u)return;META.customer(wa,{type:"text",text:t.trim()});$("#simtxt").value="";refresh()};
  $("#simsend").onclick=()=>send($("#simtxt").value);
  $("#simtxt").onkeydown=e=>{if(e.key==="Enter")send(e.target.value)};
  el.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>send(b.dataset.q));
  el.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{META.customer(wa,{type:b.dataset.r,id:b.dataset.id,payload:b.dataset.id,text:b.dataset.t,desc:b.dataset.d,ctx:b.dataset.ctx});refresh()});
  });
}

/* ===== Atendimento ===== */
const ST_CONV={bot:["Bot","p-info"],fila:["Na fila","p-warn"],atendimento:["Em atendimento","p-ok"],encerrada:["Sem protocolo","p-mute"]};
const janela=conv=>24*H-(now()-conv.lastIn);
function janelaPill(conv){const r=janela(conv);if(r<=0)return `<span class="pill p-bad">Janela 24 h fechada</span>`;const h=Math.floor(r/H),m=Math.floor((r%H)/MIN);return `<span class="pill ${h<2?"p-warn":"p-ok"}">Janela: ${h}h${String(m).padStart(2,"0")}</span>`}
const TICK={accepted:"◷",sent:"✓",delivered:"✓✓",read:"✓✓",failed:"falhou"};
function msgHtml(x,conv){
  if(x.dir==="sys") return `<div class="msg sys">${esc(x.text)} · ${hhmm(x.ts)}</div>`;
  if(x.dir==="note") return `<div class="msg note" style="white-space:pre-wrap">${esc(x.text)}</div>`;
  const who=x.dir==="out"?(x.from==="bot"?"Bot":x.from==="sistema"?(x.tpl?"Template · "+x.tpl:"Sistema"):(conv.agente||"Atendente")):"";
  return `<div class="msg ${x.dir} ${x.from==="bot"?"bot":""}">${who?`<span class="who">${esc(who)}</span>`:""}${x.header?`<b>${esc(x.header)}</b>`:""}<span class="txt">${esc(x.text)}</span>${x.opts?.length?`<div class="opts">${x.opts.map(o=>`<span>${esc(o)}</span>`).join("")}</div>`:""}
   ${x.err?`<span class="errline">${x.err.code} · ${esc(ERR_PT[x.err.code]||x.err.title)}</span>`:""}
   <span class="meta">${hhmm(x.ts)}${x.dir==="out"&&x.status?`<span class="tick-${x.status}" title="${x.status}">${TICK[x.status]}</span>`:""}</span></div>`;
}

const RESPOSTAS=[["ola","Olá, {{nome}}! Em que posso ajudar?","todas"],["cpf","Pode me confirmar o CPF ou CNPJ do titular?","todas"],["uc","Qual é o número da sua unidade consumidora (UC) na CEMIG? Ele aparece na conta de luz.","todas"],["verificar","Vou verificar e te retorno em instantes.","todas"],
 ["2via","Segue a segunda via. Qualquer dúvida estou por aqui.","Cobrança"],["acordo","Posso te ajudar a montar um acordo para as faturas em aberto. Prefere à vista ou parcelado?","Cobrança"],
 ["saldo","Vou conferir o seu saldo de energia e o rateio deste mês.","Sucesso do Cliente"],["titular","Para a troca de titularidade, preciso do documento do novo titular e da conta de luz mais recente.","Sucesso do Cliente"]];
const esperaDe=c=>now()-(c.msgs.filter(m=>m.dir==="in").at(-1)?.ts||c.lastIn);
const fmtEspera=ms=>ms<H?`${Math.max(1,Math.round(ms/MIN))} min`:`${Math.floor(ms/H)} h ${Math.round((ms%H)/MIN)} min`;
const fechando=c=>c.status==="atendimento"&&janela(c)>0&&janela(c)<2*H;
const aguardaResposta=c=>c.msgs.filter(m=>m.dir==="in"||m.dir==="out").at(-1)?.dir==="in";
/* fila do setor sem distribuição automática: a equipe divide entre si (Q-OP3). A lista mostra quem espera há mais tempo primeiro. */
const ordemFila=list=>[...list].sort((a,b)=>esperaDe(b)-esperaDe(a));

function assumir(conv){
  const ct=contato(conv.c),de=conv.agente;
  conv.status="atendimento";conv.agente=ME.nome;if(conv.setor==="—")conv.setor=ME.equipe||IP.equipePadrao;
  if(conv.flow){conv.flow.done=true;execFim(conv,"transferida")}
  if(!conv.prot)conv.prot=newProt();
  conv.msgs.push({dir:"sys",text:de&&de!==ME.nome?`${ME.nome} assumiu a conversa de ${de}`:`${ME.nome} assumiu a conversa`,ts:now()});
  if(conv.lastInId)APP.markRead(conv.lastInId);
  if(IP.msgInicio&&janela(conv)>0&&!de)APP.text(conv,interp(IP.msgInicio,conv,ct),{from:"agente"});
  if(ME.papel!=="admin")ct.carteira={nome:ME.nome,setor:conv.setor};
  log("app",`protocolo_atualizado → CRM: ${conv.prot} assumido por ${ME.nome}`);
  S.conv=conv.id;S.ifil="minhas";
}

function dlgEncerrar(conv){
  const ct=contato(conv.c),aberta=janela(conv)>0;
  modal(`<h2>Encerrar protocolo ${esc(conv.prot||"")}</h2>
   <div class="field"><label for="en-mot">Motivo <span class="muted">(obrigatório)</span></label><select id="en-mot"><option value="">Escolha o motivo</option>${Object.entries(MOTIVOS_CRM).map(([t,l])=>`<optgroup label="${t}">${l.map(m=>`<option value="${t}: ${m}">${m}</option>`).join("")}</optgroup>`).join("")}</select><span class="hint">Lista do CRM. Ao encerrar, o caso é registrado no CRM (Q-OP13, A CONFIRMAR).</span></div>
   <div class="field"><label for="en-tipo">Tipo de encerramento</label><select id="en-tipo"><option value="padrao">Padrão: envia a mensagem de fim, a pesquisa (nota de 1 a 5) e "Precisa de mais alguma coisa?"</option><option value="silencioso">Silencioso: não envia nada pelo WhatsApp</option></select></div>
   <div class="field"><label for="en-hist">Enviar histórico ao cliente</label><select id="en-hist"><option value="nao">Não enviar</option><option value="canal">No WhatsApp</option><option value="email">No e-mail do contato</option><option value="ambos">Nos dois</option></select></div>
   ${aberta?"":`<div class="callout c-warn">A janela de 24 h está fechada: mensagem de fim, histórico no WhatsApp e pesquisa não podem ser enviados.</div>`}
   <div class="acts"><button class="btn" data-x>Cancelar</button><button class="btn primary" id="en-ok" disabled>Encerrar</button></div>`,d=>{
    const ok=d.querySelector("#en-ok"),mot=d.querySelector("#en-mot");mot.onchange=()=>ok.disabled=!mot.value;
    ok.onclick=()=>{
      const tipo=d.querySelector("#en-tipo").value,hst=d.querySelector("#en-hist").value,prot=conv.prot,fala=aberta&&tipo==="padrao";
      if(tipo==="padrao"&&aberta&&IP.msgFim)APP.text(conv,interp(IP.msgFim,conv,ct),{from:"sistema"});
      if(fala&&(hst==="canal"||hst==="ambos"))APP.text(conv,`Histórico do atendimento ${prot}: [LINK_PROTOCOLO]`,{from:"sistema"});
      if(hst==="email"||hst==="ambos")log("app",`Histórico do protocolo ${prot} enviado ao e-mail do contato`);
      conv.status="encerrada";conv.motivo=mot.value;
      conv.msgs.push({dir:"sys",text:`Encerrada por ${ME.nome} · ${tipo==="silencioso"?"silencioso · ":""}motivo: ${mot.value}`,ts:now()});
      if(fala){APP.list(conv,"Como foi seu atendimento hoje? Dê uma nota de 1 a 5.","Avaliar",[5,4,3,2,1].map(n=>({id:"CSAT:"+n,title:n+" "+"★".repeat(n),description:{5:"Excelente",4:"Bom",3:"Regular",2:"Ruim",1:"Péssimo"}[n]})),{from:"sistema"});
        later(1500,()=>APP.buttons(conv,"Precisa de mais alguma coisa?",[{id:"POS:sim",title:"Sim"},{id:"POS:nao",title:"Não, obrigado"}],{from:"sistema"}))}
      log("app",`protocolo_atualizado → CRM: ${prot} encerrado (${mot.value}). Caso de Sucesso do Cliente registrado no CRM com atendente, UC, motivo e status Encerrado (proposta, Q-OP13)`);
      conv.prot=null;fecharModal();toast(`Protocolo ${prot} encerrado`);refresh();
    };
  });
}

function dlgTransferir(conv){
  const ct=contato(conv.c),naFila=e=>CONVS.filter(c=>c.status==="fila"&&c.setor===e).length;
  const abertas=n=>CONVS.filter(c=>c.status==="atendimento"&&c.agente===n).length;
  const atds=USERS.filter(u=>u.papel==="atendente"&&u.nome!==conv.agente);
  modal(`<h2>Transferir conversa</h2><p class="muted small">Envie ${esc(ct.nome)} para a fila de um setor ou direto para um atendente. A nota fica visível só para a equipe.</p>
   <div class="field"><label for="tr-set">Para</label><select id="tr-set"><optgroup label="Fila do setor">${EQUIPES.map(e=>`<option value="s:${e}">${e} · ${naFila(e)} na fila</option>`).join("")}</optgroup>
    <optgroup label="Atendente">${atds.map(u=>`<option value="a:${u.id}">${esc(u.nome)} · ${esc(u.equipe)} · ${abertas(u.nome)} conversa(s) · ${ST_ATD[S.stat[u.id]||"online"][0]}</option>`).join("")}</optgroup></select><span class="hint">Sem limite de conversas por atendente (Q-OP2).</span></div>
   <div class="field"><label for="tr-nota">Nota para quem assumir</label><textarea id="tr-nota" rows="3" placeholder="Resumo do caso e o que falta resolver"></textarea><span class="hint">Nota obrigatória ao transferir: A CONFIRMAR.</span></div>
   <div class="acts"><button class="btn" data-x>Cancelar</button><button class="btn primary" id="tr-ok">Transferir</button></div>`,d=>{
    d.querySelector("#tr-ok").onclick=()=>{
      const [tipo,alvo]=d.querySelector("#tr-set").value.split(/:(.*)/),nota=d.querySelector("#tr-nota").value.trim();
      const u=tipo==="a"?USERS.find(x=>x.id===alvo):null,set=u?u.equipe:alvo;
      if(nota)conv.msgs.push({dir:"note",text:`Nota de ${ME.nome}: ${nota}`,ts:now()});
      conv.setor=set;
      if(u){conv.status="atendimento";conv.agente=u.nome;conv.msgs.push({dir:"sys",text:`Transferida por ${ME.nome} para ${u.nome}`,ts:now()})}
      else{conv.status="fila";conv.agente=null;conv.msgs.push({dir:"sys",text:"Transferida para a fila "+set,ts:now()})}
      if(IP.msgEncaminhando&&janela(conv)>0)APP.text(conv,interp(IP.msgEncaminhando,conv,ct),{from:"sistema"});
      log("app",`protocolo_atualizado → CRM: ${conv.prot} transferido para ${u?u.nome:set}`);
      fecharModal();toast(`Transferida para ${u?u.nome:"a fila "+set}`);refresh();
    };
  });
}

/* F2: janela de 24 h fechada → escolher modelo aprovado e preencher as variáveis */
function dlgModelo(conv){
  const ct=contato(conv.c),aprov=TEMPLATES.filter(t=>t.status==="APPROVED"&&fin(ct,finDoModelo(t)));
  if(!aprov.length){toast("Nenhum modelo aprovado que o consentimento deste contato permita.");return}
  let sel=aprov[0].id;const sug=VAR_OPTS.map(o=>paramFor(o,ct));
  modal(`<h2>Enviar modelo</h2><p class="muted small">Fora da janela de 24 h a Meta só entrega modelo aprovado, cobrado pela categoria. Só aparecem os modelos que o consentimento do contato permite; as variáveis vêm da ficha.</p><div id="md-body" style="display:grid;gap:12px"></div>
   <div class="acts"><button class="btn" data-x>Cancelar</button><button class="btn primary" id="md-ok">Enviar modelo</button></div>`,d=>{
    const vals=()=>[...d.querySelectorAll("[data-mv]")].map(i=>i.value.trim());
    const draw=()=>{const t=tpl(sel),pc=paramCount(t.body);
      d.querySelector("#md-body").innerHTML=`<div class="field"><label for="md-t">Modelo aprovado</label><select id="md-t">${aprov.map(x=>`<option value="${x.id}" ${x.id===sel?"selected":""}>${esc(x.nome)} · ${CAT_LABEL[x.cat]} · ${usd(PRECO[x.cat.toLowerCase()])}</option>`).join("")}</select></div>
       ${Array.from({length:pc},(_,i)=>`<div class="field"><label for="md-v${i}">Variável {{${i+1}}}</label><input type="text" id="md-v${i}" data-mv value="${esc(sug[i]??"")}"></div>`).join("")}
       <div class="field"><span class="lb">Prévia</span><div class="callout c-mute" id="md-prev" style="display:block;white-space:pre-wrap"></div></div>`;
      const prev=()=>{d.querySelector("#md-prev").textContent=t.body.replace(/\{\{(\d+)\}\}/g,(m,n)=>vals()[n-1]||m)};prev();
      d.querySelectorAll("[data-mv]").forEach(i=>i.oninput=prev);d.querySelector("#md-t").onchange=e=>{sel=e.target.value;draw()};
    };draw();
    d.querySelector("#md-ok").onclick=()=>{const v=vals(),i=v.findIndex(x=>!x);if(i>=0){toast(`Preencha a variável {{${i+1}}} para enviar.`);return}APP.template(conv,tpl(sel),v);fecharModal();refresh()};
  });
}

/* F11: revogar consentimento por finalidade, com confirmação e registro na auditoria */
const FINS={marketing:["Marketing","O contato sai das campanhas de marketing."],comunicados:["Comunicados","O contato deixa de receber avisos de utilidade (faturas, manutenção)."],cobranca:["Cobrança","O contato sai da régua de cobrança; a cobrança passa a ser manual."]};
function dlgRevogar(ct,campo){
  const nome=campo==="lgpd"?"tratamento de dados (LGPD)":"finalidade "+FINS[campo][0];
  modal(`<h2>Revogar consentimento</h2><p>${esc(ct.nome)}: revogar <b>${nome}</b>. ${campo==="lgpd"?"O bot volta a pedir o consentimento antes de seguir o atendimento.":FINS[campo][1]+" Continua podendo falar com a empresa."}</p>
   <div class="field"><label for="rv-obs">Pedido do cliente <span class="muted">(obrigatório)</span></label><textarea id="rv-obs" rows="2" placeholder="Ex.: pediu por telefone para não receber mais promoções"></textarea><span class="hint">Fica registrado com data, hora e quem revogou.</span></div>
   <div class="acts"><button class="btn" data-x>Cancelar</button><button class="btn primary" id="rv-ok">Revogar</button></div>`,d=>{
    d.querySelector("#rv-ok").onclick=()=>{const obs=d.querySelector("#rv-obs").value.trim();if(!obs){toast("Escreva o pedido do cliente");return}
      if(campo==="lgpd")ct.lgpd=false;else{ct.finsOff=[...new Set([...(ct.finsOff||[]),campo])];if(Object.keys(FINS).every(k=>ct.finsOff.includes(k)))ct.optin=false}
      const cv=CONVS.find(v=>v.c===ct.id);cv&&cv.msgs.push({dir:"sys",text:`Consentimento revogado (${nome}) por ${ME.nome}${obs?": "+obs:""}`,ts:now()});
      log("app",`Auditoria: ${ME.nome} revogou ${nome} do contato ${ct.id}`);fecharModal();toast("Consentimento revogado e registrado na auditoria");refresh()};
  });
}

      ||`<p class="empty">${fil==="minhas"?`Nenhuma conversa com você.${counts("fila")?` <button class="btn sm" data-f="fila">Ver fila do setor (${counts("fila")})</button>`:""}`:fil==="fila"?"Fila vazia. Bom trabalho.":"Nenhuma conversa."}</p>`}</div></div>

/* validação de fluxo: o que impede publicar */
function validaFluxo(F){
  const P=[];const ids=Object.keys(F.nodes);
  const alc=new Set();const q=[F.start];while(q.length){const id=q.shift();if(alc.has(id)||!F.nodes[id])continue;alc.add(id);arestas(F.nodes[id]).forEach(([to])=>q.push(to))}
  ids.forEach(id=>{const n=F.nodes[id];
    if(!alc.has(id)) P.push([id,"aviso","Não conectado a partir do início (só roda por ponto de inicialização)"]);
    arestas(n).forEach(([to,,p])=>{if(!F.nodes[to])P.push([id,"erro",`Liga para um nó que não existe (${p})`])});
    const precisaNext={inicio:"next",variavel:"next",cronometro:"next",captura:"next",http:"next"}[n.tipo];
    if(precisaNext&&!n[precisaNext]) P.push([id,"erro","Sem próximo passo"]);
    if(n.tipo==="mensagem"&&!n.next&&!(n.subtipo==="template"&&n.ramos&&Object.values(n.ramos).some(Boolean))) P.push([id,"erro","Sem próximo passo"]);
    if(n.tipo==="mensagem"&&n.subtipo==="template"){const T=tpl(n.tpl);if(!T)P.push([id,"erro","Template não escolhido"]);else if(T.status!=="APPROVED")P.push([id,"erro","Template não aprovado pela Meta"])}
    if(n.tipo==="menu"){if(!n.opcoes.length)P.push([id,"erro","Menu sem opções"]);n.opcoes.forEach((o,i)=>{if(!o.next)P.push([id,"erro",`Opção "${o.titulo}" sem destino`])});
      if(n.formato==="botoes"&&n.opcoes.length>3)P.push([id,"erro","Botões: no máximo 3 (use lista)"]);if(n.opcoes.length>10)P.push([id,"erro","Lista: no máximo 10 opções"]);
      n.opcoes.forEach(o=>{if(o.titulo.length>(n.formato==="botoes"?20:24))P.push([id,"aviso",`"${o.titulo}" passa do limite de caracteres e será cortado`])})}
    if(n.tipo==="condicao"&&!n.senao) P.push([id,"aviso","Sem caminho senão"]);
    if(n.tipo==="captura"&&!n.variavel) P.push([id,"erro","Escolha onde salvar o dado"]);
    if(n.tipo==="ia"&&(!n.transferir||!n.resolvido)) P.push([id,"erro","Defina os caminhos resolveu e transferir"]);
  });
  if(F.nodes[F.start]&&F.nodes[F.start].tipo==="mensagem"&&F.nodes[F.start].subtipo!=="template"&&F.id!==IP.fluxoPadrao) P.push([F.start,"aviso","Fluxo que começa por automação precisa abrir com template se a janela estiver fechada"]);
  PONTOS.filter(p=>p.flow===F.id&&!F.nodes[p.node]).forEach(p=>P.push(["—","erro",`Ponto "${p.titulo}" aponta para nó inexistente (${p.node})`]));
  return P;
}
/* layout em camadas a partir do início */
function layoutFluxo(F){
  const depth={},order=[];const q=[[F.start,0]];
  while(q.length){const[id,d]=q.shift();if(depth[id]!=null||!F.nodes[id])continue;depth[id]=d;order.push(id);arestas(F.nodes[id]).forEach(([to])=>q.push([to,d+1]))}
  const maxD=Math.max(0,...Object.values(depth));
  Object.keys(F.nodes).forEach(id=>{if(depth[id]==null){depth[id]=maxD+1;order.push(id)}});
  const rows={};order.forEach(id=>(rows[depth[id]]=rows[depth[id]]||[]).push(id));
  const W=210,HH=120,maxC=Math.max(...Object.values(rows).map(r=>r.length));
  const pos={};Object.entries(rows).forEach(([d,ids])=>ids.forEach((id,i)=>pos[id]={x:16+(i+(maxC-ids.length)/2)*W,y:16+d*HH}));
  return {pos,w:maxC*W+32,h:(Math.max(...Object.keys(rows).map(Number))+1)*HH+24};
}
const GRUPO_COR={Gatilho:"var(--accent)",Mensagem:"var(--ok)",Captura:"var(--warn)",Lógica:"var(--muted)",Integração:"var(--accent)",Fim:"var(--bad)"};
function resumoNo(n){
  switch(n.tipo){
    case "mensagem": return n.subtipo==="template"?`template ${tpl(n.tpl)?.nome||"?"}`:(n.texto||"").slice(0,48);
    case "menu": return `${n.formato==="botoes"?"botões":"lista"} · ${n.opcoes.length} opções`;
    case "captura": return `${n.dado} → ${n.variavel}`;
    case "condicao": return `${n.regras.length} regra(s)`;
    case "variavel": return `${n.variavel} = ${n.valor}`;
    case "cronometro": return `espera ${n.minutos} min`;
    case "http": return `${n.metodo} ${(n.url||"").replace("https://","").slice(0,30)}`;
    case "ia": return agente(n.agente)?.nome||"?";
    case "transferir": return n.equipe;
    case "agente_cobranca": return "política de negociação em cascata";
    default: return "";
  }
}

    ${VARS.map((v,i)=>`<tr><td><input type="text" id="vc${i}" data-var="${i}" data-f="codigo" value="${esc(v.codigo)}" class="mono" style="min-width:150px"></td>

/* ===== Agendamentos ===== */

VIEWS.agendamentos=()=>{
  S.agF=S.agF||"todos";

  const lst=AGENDAMENTOS.filter(a=>S.agF==="todos"||a.status===S.agF).sort((a,b)=>b.quando-a.quando);

   <div class="ifilters" style="border:0;padding:0">${["todos","agendado","iniciado","falha","cancelado"].map(k=>`<button type="button" data-agf="${k}" aria-pressed="${S.agF===k}">${k==="todos"?"Todos":ST_AG[k][0]} · ${cnt(k)}</button>`).join("")}</div>

   <div class="panel"><div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Ponto de inicialização</th><th>Contato</th><th>Canal</th><th>Responsável</th><th>Situação</th><th></th></tr></thead><tbody>
    ${lst.map(a=>{const c=contato(a.c),p=PONTOS.find(x=>x.id===a.ponto);return `<tr><td class="mono small">${new Date(a.quando).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"medium"})}</td><td class="small">${esc(p?.titulo||"(removido)")}</td><td>${esc(c.nome)}<div class="muted mono" style="font-size:.74rem">${esc(c.tel)}</div></td><td class="small">WhatsApp Oficial</td><td class="mono small">${esc(a.resp)}</td>
     <td><span class="pill ${ST_AG[a.status][1]}">${ST_AG[a.status][0]}</span>${a.motivo?`<div class="small" style="color:var(--bad);margin-top:4px">${esc(a.motivo)}</div>`:""}</td>
     <td>${a.status==="agendado"?`<button class="btn ghost sm" data-agc="${a.id}">Cancelar</button>`:a.status==="falha"?`<button class="btn ghost sm" data-agr="${a.id}">Tentar de novo</button>`:""}</td></tr>`}).join("")||`<tr><td colspan="7" class="empty">Nada neste filtro.</td></tr>`}
   </tbody></table></div></div></div>`;
  bindAutoTabs();
  const V=$("#view");
  bindJTabs();
  V.querySelectorAll("[data-agf]").forEach(b=>b.onclick=()=>{S.agF=b.dataset.agf;render()});

/* ===== Templates ===== */
const ST_TPL={APPROVED:["Aprovado","p-ok"],PENDING:["Em análise","p-warn"],REJECTED:["Rejeitado","p-bad"],RASCUNHO:["Rascunho","p-mute"]};
function tplPreview(t){
  const body=esc(t.body||"").replace(/\{\{(\d+)\}\}/g,'<span class="var">{{$1}}</span>');
  return `<div class="phone"><div class="phone-h">Pré-visualização</div><div class="wa">${t.header?`<div class="hd">${esc(t.header)}</div>`:""}<div class="bd">${body||'<span class="muted">Corpo da mensagem</span>'}</div>${t.footer?`<div class="ft">${esc(t.footer)}</div>`:""}</div>${(t.botoes||[]).filter(Boolean).map(b=>`<div class="wa-btn">${esc(b)}</div>`).join("")}</div>`;
}
function validaTpl(t){
  const e={};
  if(!/^[a-z0-9_]{3,512}$/.test(t.nome)) e.nome="Use só letras minúsculas, números e _ (ex.: lembrete_vencimento).";
  else if(TEMPLATES.some(x=>x.nome===t.nome&&x.id!==t.id)) e.nome="Já existe um template com esse nome.";
  if(!t.body.trim()) e.body="O corpo é obrigatório.";
  else if(t.body.length>1024) e.body="Máximo de 1.024 caracteres.";
  else{const u=[...new Set([...t.body.matchAll(/\{\{(\d+)\}\}/g)].map(m=>+m[1]))].sort((a,b)=>a-b);
    if(u.some((x,i)=>x!==i+1)) e.body="As variáveis precisam ser sequenciais: {{1}}, {{2}}, {{3}}…";
    else if(/^\s*\{\{\d+\}\}|\{\{\d+\}\}[.!?\s]*$/.test(t.body)) e.body="A Meta rejeita templates que começam ou terminam com variável.";}
  if(t.header.length>60) e.header="Cabeçalho: máximo de 60 caracteres.";
  if(t.botoes.filter(Boolean).some(b=>b.length>25)) e.botoes="Cada botão: até 25 caracteres.";
  if(t.cat==="MARKETING"&&!/sair/i.test(t.footer+t.body)) e.footer="Marketing deve dizer como parar de receber (ex.: responda SAIR).";
  return e;
}
/* converte o formulário no corpo que a API de templates espera */
function tplPayload(t){
  const comps=[];
  if(t.header) comps.push({type:"HEADER",format:"TEXT",text:t.header});
  const vars=paramCount(t.body);
  comps.push({type:"BODY",text:t.body,...vars?{example:{body_text:[["Juliana","outubro","10/10"].slice(0,vars).concat(Array(Math.max(0,vars-3)).fill("exemplo"))]}}:{}});
  if(t.footer) comps.push({type:"FOOTER",text:t.footer});
  const bt=t.botoes.filter(Boolean); if(bt.length) comps.push({type:"BUTTONS",buttons:bt.map(b=>({type:"QUICK_REPLY",text:b}))});
  return {name:t.nome,language:t.idioma,category:t.cat,components:comps};
}
VIEWS.templates=()=>{
  if(S.tplEdit) return tplEditor();
  head("Modelos","Mensagens pré-aprovadas pela Meta. Obrigatórias para iniciar conversa ou falar depois de 24 h.",`<button class="btn primary" id="novo">Novo modelo</button>`);
  $("#view").innerHTML=`<div class="content"><div class="panel"><div class="tbl-wrap"><table><thead><tr><th>Nome</th><th>Categoria</th><th>Situação</th><th>ID na Meta</th><th class="r">Custo fora da janela</th><th class="r">Variáveis</th></tr></thead><tbody>

function tplEditor(){
  const t=S.tplEdit, ro=t.status==="APPROVED"||t.status==="PENDING";
  head(t.id?t.nome:"Novo template",ro?"Templates aprovados ou em análise não podem ser editados aqui. Duplique para criar uma variação.":"Preencha e envie para análise. O corpo da requisição aparece abaixo.",`<button class="btn" id="voltar">Voltar</button>${ro?`<button class="btn" id="dup">Duplicar</button>`:`<button class="btn primary" id="enviar">Enviar para a Meta</button>`}`);
  const e=validaTpl(t);
  const f=(id,label,html,hint="")=>`<div class="field"><label for="${id}">${label}</label>${html}${e[id]&&!ro?`<span class="err">${e[id]}</span>`:hint?`<span class="hint">${hint}</span>`:""}</div>`;
  $("#view").innerHTML=`<div class="content"><div class="builder"><div style="display:grid;gap:16px;min-width:0"><div class="panel"><div class="panel-b">
   ${f("nome","Nome",`<input type="text" id="nome" value="${esc(t.nome)}" ${ro?"disabled":""}>`,"Identificador exigido pela Meta")}
   <div class="grid2">${f("cat","Categoria",`<select id="cat" ${ro?"disabled":""}>${Object.entries(CAT_LABEL).map(([k,l])=>`<option value="${k}" ${t.cat===k?"selected":""}>${l} · ${usd(PRECO[k.toLowerCase()])}</option>`).join("")}</select>`,"Se o texto parecer promoção, a Meta reclassifica para Marketing")}
   ${f("idioma","Idioma",`<select id="idioma" ${ro?"disabled":""}><option value="pt_BR">pt_BR</option></select>`)}</div>
   ${f("header","Cabeçalho (opcional)",`<input type="text" id="header" value="${esc(t.header)}" ${ro?"disabled":""}>`,`${t.header.length}/60`)}
   ${f("body","Corpo",`<textarea id="body" ${ro?"disabled":""}>${esc(t.body)}</textarea>`,`${t.body.length}/1024 · variáveis {{1}}, {{2}}…`)}
   ${ro?"":`<div class="row"><span class="muted small">Inserir variável:</span><button class="btn sm" data-ins>+ variável</button></div>`}
   ${f("footer","Rodapé (opcional)",`<input type="text" id="footer" value="${esc(t.footer)}" ${ro?"disabled":""}>`)}
   ${f("botoes","Botões de resposta rápida",t.botoes.map((b,i)=>`<input type="text" id="bt${i}" data-b="${i}" value="${esc(b)}" placeholder="Botão ${i+1}" ${ro?"disabled":""}>`).join(""),"O payload de cada botão é definido na hora do envio")}
   ${ro?"":`<button class="btn sm" id="addbt" style="justify-self:start">Adicionar botão</button>`}
  </div></div>
  <div class="panel"><div class="panel-h"><h3>POST /${CFG.ver}/${CFG.waba}/message_templates</h3></div><div class="panel-b"><pre class="json">${esc(JSON.stringify(tplPayload(t),null,2))}</pre></div></div></div>
  ${tplPreview(t)}</div></div>`;
  $("#voltar").onclick=()=>{S.tplEdit=null;render()};
  const upd=(k,v)=>{t[k]=v;render()};
  ["nome","header","body","footer"].forEach(k=>{const el=$("#"+k);if(el)el.oninput=ev=>upd(k,ev.target.value)});
  $("#cat")&&($("#cat").onchange=ev=>upd("cat",ev.target.value));
  $("#idioma")&&($("#idioma").value=t.idioma,$("#idioma").onchange=ev=>upd("idioma",ev.target.value));
  $("#view").querySelectorAll("[data-b]").forEach(el=>el.oninput=ev=>{t.botoes[+el.dataset.b]=ev.target.value;render()});
  $("#addbt")&&($("#addbt").onclick=()=>{if(t.botoes.length<3){t.botoes.push("");render()}else toast("Até 3 botões de resposta rápida neste protótipo")});
  $("#view").querySelector("[data-ins]")?.addEventListener("click",()=>{t.body+=(t.body&&!t.body.endsWith(" ")?" ":"")+`{{${paramCount(t.body)+1}}}`;render()});
  $("#dup")&&($("#dup").onclick=()=>{S.tplEdit={...t,id:null,nome:t.nome+"_v2",status:"RASCUNHO",botoes:[...t.botoes],metaId:null,motivo:null};render()});
  $("#enviar")&&($("#enviar").onclick=()=>{
    if(Object.keys(validaTpl(t)).length){toast("Corrija os campos destacados");return}
    S.conOpen=true;
    const res=graph("POST",`${CFG.waba}/message_templates`,tplPayload(t));
    if(res.status!==200){toast("A Meta recusou: "+res.json.error.error_data.details);refresh();return}
    const novo={...t,id:t.id||"t"+(TEMPLATES.length+1),status:"PENDING",metaId:res.json.id,botoes:t.botoes.filter(Boolean)};
    const i=TEMPLATES.findIndex(x=>x.id===novo.id); i>=0?TEMPLATES[i]=novo:TEMPLATES.push(novo);
    S.tplEdit=null;toast("Enviado. Aguardando o webhook de aprovação");refresh();
  });
}

const ST_CAMP={rascunho:["Rascunho","p-mute"],agendada:["Agendada","p-warn"],enviando:["Enviando","p-info"],pausada:["Pausada","p-warn"],concluida:["Concluída","p-ok"]};
const VAR_OPTS=["Primeiro nome","Mês de referência","Data de vencimento","Valor da fatura","Link de pagamento"];
const novaWiz=(step=1)=>({step,tpl:null,seg:null,nome:"",quando:"agora",data:"2026-10-08T09:00",vars:[0,1,2,3,4]}); /* sem limite próprio de marketing (Q-DI7); vale o da Meta */
function paramFor(opt,c){
  const t=TITULOS.find(x=>x.c===c.id&&x.status==="aberto");
  return {"Primeiro nome":c.nome.split(" ")[0],"Mês de referência":"outubro","Data de vencimento":t?ddmm(t.venc):ddmm(now()+3*D),"Valor da fatura":t?brl(t.valor):brl(0),"Link de pagamento":"pay.performaenergy.com.br/"+hex(6)}[opt];
}
function dispararCampanha(w){
  const T=tpl(w.tpl), G=seg(w.seg);
  const camp={id:"c"+(CAMPANHAS.length+1),nome:w.nome||"Campanha sem nome",tpl:T.id,seg:G.id,status:"enviando",quando:now(),total:0,env:0,sent:0,ent:0,lid:0,resp:0,falha:0,erros:{},pulados:[]};
  CAMPANHAS.unshift(camp);
  let fila=alcancaveis(G.regras);
  fila.filter(c=>!fin(c,finDoModelo(T))).forEach(c=>camp.pulados.push([c.nome,"revogou a finalidade "+FINS[finDoModelo(T)][0]]));
  fila=fila.filter(c=>fin(c,finDoModelo(T)));
  const saldo=META.limit-[...META.uniq.values()].filter(ts=>now()-ts<D).length;
  if(fila.length>saldo){fila.slice(saldo).forEach(c=>camp.pulados.push([c.nome,"limite de 24 h do portfólio: próximo lote"]));fila=fila.slice(0,saldo)}
  camp.total=fila.length;
  log("app",`Campanha "${camp.nome}": ${fila.length} na fila de envio · ${camp.pulados.length} pulados · vazão controlada`);
  camp.vars=w.vars;camp.pend=[];camp.falhos=[];
  filaCamp(camp,fila);
}
/* envio em lotes com pausa: quem não saiu enquanto a campanha estava pausada fica em camp.pend (DI-41) */
function filaCamp(camp,lista){
  const T=tpl(camp.tpl),pc=paramCount(T.body);
  lista.forEach((c,i)=>later(i*350,()=>{
    if(camp.status==="pausada"){camp.pend.push(c);return}
    const id=APP.template(ensureConv(c),T,camp.vars.slice(0,pc).map(v=>paramFor(VAR_OPTS[v],c)),{origin:"campanha",camp});
    if(id){camp.env++;if(T.cat==="MARKETING")c.lastMkt=now()}else{camp.falha++;camp.falhos.push(c.id)}
    if(i===lista.length-1) later(4500,()=>{if(camp.status==="enviando"){camp.status="concluida";refresh()}});
  }));
  if(!lista.length&&camp.status==="enviando") camp.status="concluida";
}

/* detalhe da cobrança: linha do tempo das etapas e reenviar etapa (F8) */
function reenviarEtapa(t,e){
  const c=contato(t.c),conv=ensureConv(c),T=tpl(e.tpl);
  if(!T||T.status!=="APPROVED"){toast("O modelo desta etapa não está aprovado");return}
  if(!fin(c,"cobranca")){toast("Contato sem consentimento para cobrança");return}
  const params=[c.nome.split(" ")[0],t.competencia||"10/2026",ddmm(t.venc)].slice(0,paramCount(T.body));
  if(APP.template(conv,T,params,{origin:"cobranca",titulo:t})){(t.sentAt=t.sentAt||{})[e.d]=now();t.sent[e.d]=1;t.envios++;hist(c,`Etapa ${dLabel(e.d)} reenviada por ${ME.nome}`);toast(`Etapa ${dLabel(e.d)} reenviada`)}
}
function dlgCobranca(t){

function validaRegua(){
  const err={}, seen={};
  REGUA.forEach(e=>{
    if(!Number.isInteger(e.d)||Math.abs(e.d)>365) err[e.id]="Use um número inteiro de dias entre 0 e 365.";
    else if(seen[e.d]) err[e.id]=`Já existe um envio em ${dLabel(e.d)}.`;
    seen[e.d]=1;
    const T=e.tpl&&tpl(e.tpl);
    if(!e.humano&&e.tipo!=="negativacao"&&!T) err[e.id]=err[e.id]||"Escolha um template.";
    else if(T&&T.status!=="APPROVED") err[e.id]=err[e.id]||"Template ainda não aprovado pela Meta.";
  });
  if(!COB.dias.length) err.janela="Selecione ao menos um dia da semana.";
  if(COB.hIni>=COB.hFim) err.janela="O horário final precisa ser depois do inicial.";
  return err;
}

function bindConfigEnvios(V){
  const dirty=()=>{COB.salvo=false;render()};
  const byId=k=>REGUA.find(e=>e.id===+k);
  V.querySelectorAll("[data-rk]").forEach(el=>{
    const ev=el.type==="text"?"onchange":el.type==="number"?"oninput":"onchange";
    el[ev]=()=>{const e=byId(el.dataset.rk),f=el.dataset.f;
      if(f==="tipo"){const n=Math.abs(e.d)||1;e.d=el.value==="antes"?-n:el.value==="dia"?0:n}
      if(f==="dias"){const n=parseInt(el.value,10);if(isNaN(n))return;e.d=e.d<0?-Math.abs(n):Math.abs(n)}
      if(f==="acaoTipo"){const v=el.value;e.humano=v==="humano";e.tipo=v==="proposta"||v==="negativacao"?v:null;if(e.humano||v==="negativacao")e.tpl=null;else e.tpl=e.tpl||(v==="proposta"?"t13":"t2")}
      if(f==="canal_whatsapp"||f==="canal_email"){const ch=f.slice(6);e.canais=e.canais||["whatsapp"];e.canais=el.checked?[...new Set([...e.canais,ch])]:e.canais.filter(x=>x!==ch)}
      if(f==="tpl") e.tpl=el.value||null;
      if(f==="acao") e.acao=el.value;
      if(f==="ativo") e.ativo=el.checked;
      dirty();
    };
  });
  V.querySelectorAll("[data-rx]").forEach(b=>b.onclick=()=>{REGUA.splice(REGUA.findIndex(e=>e.id===+b.dataset.rx),1);dirty()});
  const livre=(sinal)=>{let n=sinal<0?5:15;while(REGUA.some(e=>e.d===sinal*n))n+=sinal<0?1:5;return sinal*n};
  $("#add-antes").onclick=()=>{REGUA.push({id:reguaSeq++,d:livre(-1),tpl:"t1",acao:"Lembrete antecipado",ativo:true});dirty()};
  $("#add-depois").onclick=()=>{REGUA.push({id:reguaSeq++,d:livre(1),tpl:"t2",acao:"Nova cobrança",ativo:true});dirty()};

function bars(data,keys,colors,{h=200,fmt=v=>v}={}){
  const W=640,P={l:40,r:8,t:10,b:26},iw=W-P.l-P.r,ih=h-P.t-P.b;
  const max=Math.max(1,...data.map(d=>keys.reduce((s,k)=>s+d[k],0)));
  const step=Math.pow(10,Math.floor(Math.log10(max)));const top=Math.ceil(max/step)*step;
  const bw=iw/data.length*.6;
  let s=`<svg viewBox="0 0 ${W} ${h}" role="img">`;
  [0,top/2,top].forEach(t=>{const y=P.t+ih-(t/top)*ih;s+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${P.l-6}" y="${y+4}" text-anchor="end">${fmt(t)}</text>`});
  data.forEach((d,i)=>{let acc=0;const x=P.l+(i+.5)*(iw/data.length)-bw/2;
    keys.forEach((k,j)=>{const bh=(d[k]/top)*ih;s+=`<rect x="${x}" y="${P.t+ih-acc-bh}" width="${bw}" height="${Math.max(0,bh)}" fill="${colors[j]}" rx="2"><title>${d.l}: ${fmt(d[k])}</title></rect>`;acc+=bh});
    s+=`<text x="${x+bw/2}" y="${h-8}" text-anchor="middle">${d.l}</text>`});
  return s+"</svg>";
}

function painel360(c,conv,{compacto=false}={}){
  const u=ucOf(c),d=dividaDe(c),ab=TITULOS.filter(t=>t.c===cid(c)&&t.status==="aberto");
  const prox=(()=>{const pr=u.promessas.find(p=>p.status==="vigente");if(pr)return `Lembrete da promessa em ${ddmm(pr.data-D)}`;const ac=u.acordos.find(a=>a.status==="aguardando formalização");if(ac)return `Formalizar acordo ${ac.id}`;
    const t=ab.map(t=>({t,e:proximaEtapa(t)})).find(x=>x.e);return t?`Régua ${dLabel(t.e.d)} em ${ddmm(dataEnvio(t.t.venc,t.e.d).ms)}`:"—"})();
  const casc=d.titulos.length?cascata(d.principal,d.total)[0]:null;
  const ultimo=[...(conv?.msgs||[])].reverse().find(m=>m.dir==="in");
  const negPill={"em dia":"p-ok","aviso enviado":"p-warn","elegível":"p-bad","concluída":"p-bad"}[u.neg]||"p-mute";
  const flags=flagsHistorico(c);
  const row=(k,v)=>`<dt>${k}</dt><dd>${v}</dd>`;
  return `<dl>
   ${row("Cliente",esc(c.nome))}${row("UC",`<span class="mono">${u.uc}</span>`)}${row(u.tipoDoc,`<span class="mono">${u.doc}</span>`)}
   ${row("Contrato",`<span class="pill ${u.contrato.status==="Ativo"?"p-ok":"p-warn"}">${esc(u.contrato.status)}</span>`)}
   ${u.cancel?row("Pedido de cancelamento",`${u.cancel.data} · ${u.cancel.concretizado?"concluído":"não concluído"}`):""}
   ${row("Saldo energético",`${n(u.cred.saldo)} kWh`)}${row("Energia a receber",`${n(u.cred.aCreditar)} kWh`)}${row("Média de consumo",`${n(u.media)} kWh/mês`)}
   ${row("Faturas abertas",brl(ab.reduce((s,t)=>s+t.valor,0)))}${row("Faturas vencidas",`<b>${brl(d.principal)}</b>`)}${d.encargos?row("Com encargos",brl(d.total)):""}
   ${row("Multa rescisória",brl(u.contrato.multaRescisoria))}${casc?row("Proposta autorizada",esc(ofertaCurta(casc))+" "+brl(casc.valor)):""}
   ${row("Dias de atraso",d.maxDias||"—")}${row("Negativação",`<span class="pill ${negPill}">${esc(u.neg)}</span>`)}
   ${row("Último contato",ultimo?new Date(ultimo.ts).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}):"—")}${row("Próxima ação",esc(prox))}
   ${row("Perfil",conv?.agc?.perfil?`<span class="pill p-info">${PERFIL_LABEL[conv.agc.perfil]}</span>`:"—")}
  </dl>
  ${flags.length?`<div class="tags">${flags.map(f=>`<span class="pill p-warn">${esc(f)}</span>`).join("")}</div>`:""}
  ${u.riscoJuridico?`<span class="pill p-bad">Trocou para e-mail · possível formalização jurídica</span>`:""}
  <div class="field"><span class="lb">Histórico único</span><div style="display:grid;gap:4px;${compacto?"max-height:180px;overflow:auto":""}">${[...u.hist].sort((a,b)=>a[0]-b[0]).slice(compacto?-8:0).map(([ts,t])=>`<div class="small"><span class="mono muted">${ddmm(ts)}</span> – ${esc(t)}</div>`).join("")||`<span class="muted small">Sem registros.</span>`}</div></div>`;
}
/* ações humanas ligadas ao agente: formalizar acordo e decidir aprovações */
function acoesCobranca(c){
  const u=ucOf(c),ac=u.acordos.filter(a=>a.status==="aguardando formalização"),ap=APROV.filter(a=>a.c===c.id&&a.status==="pendente");
  return `${ac.map(a=>`<div class="callout c-warn" style="display:grid;gap:6px"><span><b>Acordo ${a.id}</b> aceito pelo cliente: ${esc(a.desc)}</span><button class="btn primary sm" data-formalizar="${a.id}" style="justify-self:start">Formalizar e enviar</button></div>`).join("")}
   ${ap.map(a=>`<div class="callout c-info" style="display:grid;gap:6px"><span><b>${a.id}</b> · ${esc(a.desc)}</span><div class="row"><button class="btn primary sm" data-aprovar="${a.id}">Aprovar</button><button class="btn sm" data-negar="${a.id}">Negar</button></div></div>`).join("")}`;
}
function bindAcoesCobranca(V){
  V.querySelectorAll("[data-formalizar]").forEach(b=>b.onclick=()=>{S.conOpen=true;const ac=formalizarAcordo(b.dataset.formalizar);toast(ac?`Acordo ${ac.id} formalizado: boletos gerados e aceite anexado`:"Acordo não encontrado");refresh()});
  V.querySelectorAll("[data-aprovar]").forEach(b=>b.onclick=()=>{decidirAprovacao(b.dataset.aprovar,true);toast("Aprovado: o agente avisa o cliente");refresh()});
  V.querySelectorAll("[data-negar]").forEach(b=>b.onclick=()=>{decidirAprovacao(b.dataset.negar,false);toast("Negado: o agente segue a política");refresh()});
}

   ${POL.salvo?"":`<div class="callout c-warn"><span>Política alterada e ainda não salva. Já vale nesta simulação.</span><button class="btn primary sm" id="pol-save">Salvar política</button></div>`}
   <div class="callout c-info"><span>Ordem obrigatória: <b>à vista</b> → <b>cartão</b> (da menor para a maior parcela) → <b>boleto</b> (da menor para a maior). O agente oferece <b>uma condição por vez</b> e só libera a próxima depois de registrar a recusa.</span></div>
   <div class="grid2">
    <div class="panel"><div class="panel-h"><h3>Regras gerais</h3></div><div class="panel-b">

     <div class="grid2" style="grid-template-columns:1fr 1fr">
      <div class="field"><label for="pol-avd">Prazo do à vista (dias)</label><input type="number" id="pol-avd" data-pol="aVistaPrazoDias" min="1" value="${POL.aVistaPrazoDias}"></div>
      <div class="field"><label for="pol-pmin">Parcela mínima (R$)</label><input type="number" id="pol-pmin" data-pol="parcelaMin" min="1" value="${POL.parcelaMin}"></div>
      <div class="field"><label for="pol-alc">Alçada do agente no cartão</label><input type="number" id="pol-alc" data-pol="cartaoAlcada" min="1" max="12" value="${POL.cartaoAlcada}"><span class="hint">Acima disso, pede aprovação</span></div>
      <div class="field"><label for="pol-bmax">Máximo no boleto</label><input type="number" id="pol-bmax" data-pol="boletoMax" min="1" max="12" value="${POL.boletoMax}"></div>
      <div class="field"><label for="pol-prz">Autonomia de prazo (dias)</label><input type="number" id="pol-prz" data-pol="prazoAutonomiaDias" min="0" value="${POL.prazoAutonomiaDias}"><span class="hint">Régua de prazos: acima disso, aprovação</span></div>
      <div class="field"><label for="pol-mul">Multa por atraso (%)</label><input type="number" id="pol-mul" data-pol="multaPct" step="0.1" min="0" value="${POL.multaPct}"></div>
      <div class="field"><label for="pol-jur">Juros ao mês (%)</label><input type="number" id="pol-jur" data-pol="jurosMesPct" step="0.1" min="0" value="${POL.jurosMesPct}"></div>
      <div class="field"><label for="pol-hi">Atendimento humano</label><div class="row" style="flex-wrap:nowrap"><input type="time" id="pol-hi" data-pol="horaIni" value="${POL.horaIni}"><input type="time" id="pol-hf" data-pol="horaFim" value="${POL.horaFim}"></div></div>
     </div>
     <div class="check"><div><input type="checkbox" id="pol-hist" checked disabled><label for="pol-hist">Sempre transfere antes de propor (AG-40) se houver acordo anterior, quebra, desconto já concedido, promessa vigente, contestação aberta ou condição excepcional</label></div></div>
    </div></div>
    <div class="panel"><div class="panel-h"><h3>Simulador da cascata</h3></div><div class="panel-b">
     <div class="field"><label for="pol-sim">Valor total da dívida (R$)</label><input type="number" id="pol-sim" min="1" value="${v}" style="max-width:180px"></div>

  </div>`;
}
function bindPolitica(V){
  V.querySelectorAll("[data-pol]").forEach(el=>el.onchange=()=>{const p=el.dataset.pol;let x=el.type==="checkbox"?el.checked:el.type==="number"?+el.value:el.value;setPath(POL,p,x);POL.salvo=false;render()});

const arqOfertas=caso=>cascata(caso.principal,caso.total);
const arqMesma=(a,b)=>a&&b&&a.tipo===b.tipo&&a.n===b.n;
const arqProxima=caso=>arqOfertas(caso).find(o=>!o.bloq&&!caso.recusas.some(r=>arqMesma(r,o)))||null;

/* 3. Classificar [Claude · simulado]: mesma saída fechada do agente.ts */
function arqClassificar(caso,texto){
  const x=texto.toLowerCase(),it=intencao(texto,""),o=caso.ofertaAtual;
  const mapa={dificuldade:"dificuldade_financeira",negociar:"quer_negociar",nao_recebeu:"nao_recebeu_boleto",nao_entendeu:"nao_entende_cobranca",contesta:"contesta",prazo:"pede_prazo"};
  const nPed=(x.match(/\b(\d{1,2})\s?(x|vezes)\b/)||[])[1];
  const neg=/não (consigo|dá|da|posso|tenho)|nao (consigo|da|posso)|pesad|não rola|sem condi/.test(x);
  const pos=/\b(sim|aceito|fechado|pode ser|beleza|combinado|consigo sim|dá sim|da sim)\b/.test(x);
  let resp="sem_oferta_na_mesa",ped=null;
  if(o){
    if(nPed&&+nPed!==o.n&&!neg){resp="contraproposta";ped={tipo:/boleto/.test(x)?"boleto":"cartao",n:+nPed}}
    else if(neg)resp="recusa";
    else if(pos)resp="aceita";
  }
  const cont=contCode(x);
  return {intencao:cont?"contesta":mapa[it]||"outro",respostaOferta:resp,contestacao:cont||"nenhuma",
    parcelasPedidas:ped,foraDoEscopo:foraDoEscopo(texto),ameacaJuridica:it==="juridico",irritacao:it==="irritado"||/vergonha|ridícul|absurd/.test(x)};
}

/* 4. Roteador [código]: a ordem dos ifs é a prioridade das regras */
function arqRotear(caso,c){
  if(c.ameacaJuridica) return {no:"transferir",motivo:"ameaça jurídica (AG-39)",regra:"ameacaJuridica = true"};
  if(c.foraDoEscopo) return caso.foraSeguidas>=ESCOPO.limite?{no:"transferir",motivo:"insistiu em assuntos fora do escopo (AG-78)",regra:`fora do escopo pela ${caso.foraSeguidas}ª vez seguida`}:{no:"escopo",regra:"assunto fora do escopo da Performa (AG-78)"};
  if(c.contestacao!=="nenhuma") return {no:"contestar",regra:`contestação ${c.contestacao}`};
  if(c.irritacao&&caso.irritacoes>=2) return {no:"transferir",motivo:"irritação repetida",regra:"irritação pela 2ª vez"};
  if(c.respostaOferta==="aceita") return {no:"aceite",regra:"aceitou a oferta na mesa"};
  if(c.respostaOferta==="contraproposta") return {no:"contraproposta",regra:`pediu ${c.parcelasPedidas.n}x`};
  if(c.respostaOferta==="recusa") return {no:"negociar",regra:"recusou: próxima da cascata"};
  if(["dificuldade_financeira","quer_negociar"].includes(c.intencao)) return {no:"negociar",regra:"motivo já conhecido: oferecer"};
  if(c.intencao==="outro"&&!caso.ofertaAtual) return {no:"entender",regra:"motivo ainda desconhecido (Entender → Oferecer)"};
  if(caso.ofertaAtual) return {no:"negociar",regra:"resposta sem decisão: repetir a oferta"};
  return {no:"transferir",motivo:`intenção "${c.intencao}" fora deste exemplo`,regra:"sem nó para essa intenção"};
}

/* 5. Redigir [Claude · simulado]: recebe só os fatos liberados */
function arqRedigir(caso,no,o,tentativa){
  const nome=caso.cliente;
  if(no==="entender") return `Olá, ${nome}! Vi que há ${caso.faturas.length} faturas em aberto, somando ${brl(caso.total)}. Pode me contar o que dificultou o pagamento?`;
  if(no==="negociar"){
    if(ARQ_CEN[S.arq.cen].erroRedator&&tentativa===0&&o.tipo!=="avista") return `Entendo, ${nome}. Temos várias opções: ${o.n}x ou até 10x no cartão, e também boleto. Qual prefere?`;
    if(ARQ_CEN[S.arq.cen].erroRedator&&tentativa===0) return `Entendo, ${nome}. Que tal pagar ${brl(caso.principal)} à vista? Assim você fica em dia.`;
    return o.tipo==="avista"?`Entendo, ${nome}. Para facilitar, consigo tirar os juros e a multa se o pagamento for à vista: ${ofertaTxt(o)}. Consegue nessa condição?`
      :`Sem problema, ${nome}. Uma alternativa é ${ofertaTxt(o)}. Essa condição cabe no seu orçamento?`;
  }
  return null;
}
function arqVerificar(texto,valores,parcelas){
  const R=[];const dig=s=>s.replace(/\D/g,"");const ok=valores.map(v=>dig(brl(v)));
  R.push([texto.trim().endsWith("?"),"termina em pergunta (AG-02)"]);
  const vals=texto.match(/R\$\s?[\d.]+,\d{2}/g)||[];const fora=vals.filter(v=>!ok.includes(dig(v)));
  R.push([!fora.length,fora.length?`valor fora da oferta: ${fora.join(", ")}`:`valores citados batem com a oferta${vals.length?` (${vals.length})`:""}`]);
  const ps=[...texto.matchAll(/\b(\d{1,2})\s?x\b/gi)].map(m=>+m[1]);const pf=ps.filter(n=>n!==parcelas);
  R.push([!pf.length,pf.length?`parcelamento fora da oferta: ${pf.join(", ")}x (AG-52)`:"só cita a condição liberada (AG-52)"]);
  return R;
}

/* um turno inteiro do grafo; devolve o rastro de cada etapa */
function arqTurno(A,texto){
  const caso=A.caso,T=[],ev=[],add=(no,titulo,txt,json,extra={})=>T.push({no,titulo,txt,json,...extra});
  const reg=e=>{ev.push(e);caso.eventos.push({quando:`turno ${A.turnos.length+1}`,e})};
  const wamid="wamid.HBgN"+Math.random().toString(36).slice(2,10).toUpperCase();
  add("webhook","Webhook recebe a mensagem","A Meta faz POST no /webhook. O servidor confere a assinatura X-Hub-Signature-256, responde 200 na hora e só enfileira. Nada de IA aqui.",
    {object:"whatsapp_business_account",entry:[{changes:[{field:"messages",value:{messaging_product:"whatsapp",metadata:{phone_number_id:"WA_PHONE_ID"},contacts:[{profile:{name:"Yasmin Andrade"},wa_id:ARQ_TEL}],messages:[{from:ARQ_TEL,id:wamid,timestamp:String(Math.floor(now()/1000)),type:"text",text:{body:texto}}]}}]}]});
  add("fila","Fila e trava da conversa",`Mensagem ${wamid} ainda não processada (evita duplicada). Trava conversa:${ARQ_TEL} para que nenhum outro turno do mesmo cliente rode junto.${A.junta>1?` Chegaram ${A.junta} mensagens seguidas em poucos segundos: foram juntadas num turno só (AG-60).`:""}`,
    {job:{telefone:ARQ_TEL,texto,idMeta:wamid},trava:`conversa:${ARQ_TEL}`,duplicada:false});
  add("carregar","Carregar o caso","Lê a linha do caso no banco e a dívida no Performalog. O Claude nunca é a fonte da dívida.",
    {fase:caso.fase,principal:caso.principal,total:caso.total,diasAtraso:caso.diasAtraso,ofertaAtual:caso.ofertaAtual&&ofertaCurta(caso.ofertaAtual),recusas:caso.recusas.map(ofertaCurta),historico:caso.historico});
  reg(`cliente: "${texto}"`);

  let resposta=null,motivoT=null;const h=caso.historico;
  const bloq=caso.fase==="humano"?"caso já está com uma pessoa":caso.trocouEmail?"cliente trocou para o e-mail (AG-22)":(h.acordoAnterior||h.quebraAcordo||h.promessaVigente||h.contestacaoAberta)?"histórico de negociação: acordo anterior, quebra, promessa ou contestação (AG-40)":null;
  add("portao","Portão",bloq?`Barrado: ${bloq}. O turno não passa pelo Claude.`:"Liberado: canal é o WhatsApp de origem, caso está com o agente e não há histórico que obrigue uma pessoa.",{bloqueio:bloq},{bad:!!bloq});

  if(bloq&&caso.fase==="humano"){
    add("gravar","Gravar","A mensagem fica na conversa e aparece para o atendente. O agente não responde.",{eventos:["mensagem anexada à conversa do atendente"]});
    reg("mensagem encaminhada ao atendente (agente em silêncio)");
    return {texto,trace:T,resposta:null,estado:JSON.parse(JSON.stringify(caso)),ev};
  }
  let d;
  if(bloq){d={no:"transferir",motivo:bloq,regra:"portão"};}
  else{
    const c=arqClassificar(caso,texto);
    add("classificar","Classificar · Claude (simulado)",`O Claude recebe só a oferta na mesa e a mensagem, e devolve um JSON com campos fechados. Aqui a saída foi simulada por palavras-chave; no sistema real é client.messages.parse com o claude-opus-5-5.`,
      {entrada:{ofertaNaMesa:caso.ofertaAtual?ofertaTxt(caso.ofertaAtual):"nenhuma",mensagem:texto},saida:c},{claude:true});
    if(c.respostaOferta==="recusa"&&caso.ofertaAtual){reg(`recusou: ${ofertaCurta(caso.ofertaAtual)}`);caso.recusas.push(caso.ofertaAtual);caso.ofertaAtual=null}
    if(c.irritacao)caso.irritacoes++;
    caso.foraSeguidas=c.foraDoEscopo?caso.foraSeguidas+1:0;
    d=arqRotear(caso,c);
    add("rotear","Roteador",`Regra que decidiu: ${d.regra}. Próximo nó: ${d.no}${d.motivo?` (${d.motivo})`:""}.`,{decisao:{no:d.no,...(d.motivo?{motivo:d.motivo}:{})}});
  }

  /* nós */
  let no=d.no,fatos=null,o=null,fixo=null;
  if(no==="contraproposta"){
    const c=T.find(t=>t.no==="classificar").json.saida.parcelasPedidas;
    const alvo=arqOfertas(caso).find(z=>z.tipo===c.tipo&&z.n===c.n);
    if(!alvo){no="transferir";motivoT=`pediu ${c.n}x no ${c.tipo==="cartao"?"cartão":"boleto"}, fora da política (AG-54)`}
    else if(alvo.bloq){no="transferir";motivoT=`${c.n}x deixa a parcela abaixo de ${brl(POL.parcelaMin)} (AG-50)`}
    else if(!alvo.auto){no="transferir";motivoT=`pediu ${c.n}x, acima da alçada de ${POL.cartaoAlcada}x: pedido de aprovação ao financeiro (AG-55)`}
    else{caso.ofertaAtual=alvo;no="aceite"}
    add("no",`Nó contraproposta → ${no}`,alvo?`${ofertaCurta(alvo)} existe na régua${alvo.auto?" e está dentro da alçada":""}.`:"Essa condição não existe na régua.",{pedido:c,naRegua:!!alvo,dentroDaAlcada:!!alvo?.auto});
  }
  if(no==="negociar"){
    caso.ofertaAtual=caso.ofertaAtual||arqProxima(caso);o=caso.ofertaAtual;
    if(!o){no="transferir";motivoT="recusou todas as condições da régua (AG-37)"}
    else if(!o.auto){no="transferir";motivoT=`próxima da cascata é ${ofertaCurta(o)}, acima da alçada: pedido de aprovação (AG-55)`}
    else{
      reg(`oferecido: ${ofertaCurta(o)}`);
      const lista=arqOfertas(caso).map(z=>`${caso.recusas.some(r=>arqMesma(r,z))?"✗":arqMesma(z,o)?"→":" "} ${ofertaCurta(z)}${z.bloq?" (parcela < mínimo)":!z.auto?" (pede aprovação)":""}`);
      add("no","Nó negociar","O motor da régua (código) escolhe a primeira condição não recusada, na ordem à vista → cartão → boleto. Só ela segue para o redator.",{regua:lista,liberada:ofertaTxt(o)});
      fatos=`Condição liberada: ${ofertaTxt(o)}. Débito total: ${brl(caso.total)}.`;
    }
  }
  if(no==="escopo"){
    o=caso.ofertaAtual;reg("mensagem fora do escopo: não respondida (AG-78)");
    resposta=`${ESCOPO.resposta} Voltando à sua fatura: ${o?`${ofertaTxt(o)} funciona para você?`:"pode me contar o que dificultou o pagamento?"}`;
    add("no","Nó escopo","A mensagem não é sobre a Performa (ou tenta mudar as regras do agente). Texto fixo, sem redator: o Claude não é chamado para responder, e a conversa volta para a pendência atual. A oferta na mesa não muda.",{foraSeguidas:caso.foraSeguidas,limite:ESCOPO.limite,ofertaNaMesa:o?ofertaCurta(o):null});
    o=null;
  }
  if(no==="entender"){add("no","Nó entender","Ainda não se sabe o motivo do atraso. Antes de oferecer, o agente pergunta (princípio Entender → Oferecer).",{oferta:null});fatos=`Cliente: ${caso.cliente}. ${caso.faturas.length} faturas, ${brl(caso.total)}, ${caso.diasAtraso} dias de atraso.`}
  if(no==="contestar"){
    const code=T.find(t=>t.no==="classificar").json.saida.contestacao,info=CONT[code];
    caso.contestacao=code;caso.historico.contestacaoAberta=true;reg(`contestação aberta: ${code} ${info.nome} · régua pausada`);
    if(info.humano){no="transferir";motivoT=`${code} ${info.nome}: sempre vai para uma pessoa`}
    else{resposta=code==="CONT-08"?`Obrigado por avisar, ${caso.cliente}. Pausei a cobrança dessa fatura. Pode me enviar o comprovante de pagamento por aqui?`:`Entendi, ${caso.cliente}. Registrei sua contestação (${info.nome}) e pausei a cobrança. Pode me contar mais detalhes?`;
      add("no","Nó contestar",`Classificada como ${code} ${info.nome}. Abre a contestação, pausa a régua e pede a prova. Texto fixo, sem redator.`,{contestacao:code,regua:"pausada",humano:false});}
  }
  if(no==="aceite"){
    o=caso.ofertaAtual;caso.fase="humano";reg(`aceitou: ${ofertaTxt(o)} · enviado para formalização (AG-17)`);
    resposta=`Perfeito, ${caso.cliente}! Registrei ${ofertaTxt(o)}. Uma pessoa da equipe de Cobrança vai formalizar o acordo e te enviar a forma de pagamento. Posso ajudar em mais alguma coisa?`;
    add("no","Nó aceite","Registra o aceite e passa o caso para a Cobrança formalizar. O agente não gera boleto nem promete prazo.",{aceite:ofertaCurta(o),fase:"humano",fila:"Cobrança · formalizar"});
  }
  if(no==="transferir"){
    const motivo=motivoT||d.motivo;caso.fase="humano";
    const resumo=`${caso.cliente} · ${brl(caso.total)} · ${caso.diasAtraso} dias · recusas: ${caso.recusas.map(ofertaCurta).join(", ")||"nenhuma"} · motivo: ${motivo}`;
    reg(`transferido: ${motivo}`);
    resposta=dentroHorarioHumano()?`Vou passar seu atendimento para uma pessoa da nossa equipe, que já recebe o resumo do seu caso. Tudo bem?`:`Registrei tudo o que conversamos. Nosso time atende de segunda a sexta, das ${POL.horaIni} às ${POL.horaFim}, e vai continuar daqui sem você repetir nada. Tudo bem?`;
    add("no","Nó transferir",`Motivo: ${motivo}. O atendente recebe o resumo automático (AG-24). Texto fixo, sem redator.`,{fase:"humano",resumoParaAtendente:resumo});
  }

  /* redigir + verificar, com 2 tentativas e texto fixo no fim */
  if(fatos){
    const valores=o?(o.tipo==="avista"?[o.valor,caso.total,o.isencao]:[o.parcela,caso.total]):[caso.total];
    const parcelas=o&&o.tipo!=="avista"?o.n:null;
    fixo=o?`Conseguimos ${ofertaTxt(o)}. Essa condição funciona para você?`:`Olá, ${caso.cliente}! Pode me contar o que dificultou o pagamento?`;
    for(let t=0;t<2&&!resposta;t++){
      const txt=arqRedigir(caso,no,o,t);
      add("redigir",`Redigir · Claude (simulado)${t?" · 2ª tentativa":""}`,"O Claude recebe só os fatos liberados. Não sabe que as outras condições existem, então não consegue listá-las.",{fatos,instrucao:o?"Apresente esta única condição em forma de pergunta.":"Pergunte com empatia o que dificultou o pagamento.",rascunho:txt},{claude:true});
      const R=arqVerificar(txt,valores,parcelas),ok=R.every(r=>r[0]);
      add("verificar",`Verificar${ok?"":" · barrado"}`,ok?"Todas as checagens passaram: a mensagem pode sair.":"A mensagem não sai. Volta para o redator, e na segunda falha usa o texto fixo.",{checagens:R.map(([k,l])=>(k?"✓ ":"✗ ")+l)},{bad:!ok});
      if(ok)resposta=txt;else reg(`verificador barrou: ${R.filter(r=>!r[0]).map(r=>r[1]).join("; ")}`);
    }
    if(!resposta){resposta=fixo;reg("usado texto fixo")}
  }
  reg(`agente: "${resposta}"`);
  add("gravar","Gravar o caso","Salva estado e histórico único (AG-23) e solta a trava da conversa.",{fase:caso.fase,ofertaAtual:caso.ofertaAtual&&ofertaCurta(caso.ofertaAtual),recusas:caso.recusas.map(ofertaCurta),novosEventos:ev});
  add("enviar","Enviar pela Graph API","POST /{phone_number_id}/messages com o token do System User. A janela de 24 h está aberta porque a cliente acabou de escrever.",
    {request:{messaging_product:"whatsapp",to:ARQ_TEL,type:"text",text:{body:resposta}},response:{messages:[{id:"wamid.HBgN"+Math.random().toString(36).slice(2,10).toUpperCase()}]}});
  return {texto,trace:T,resposta,estado:JSON.parse(JSON.stringify(caso)),ev};
}

/* controles de reprodução */
function arqEnviar(texto){const A=S.arq;A.junta=Array.isArray(texto)?texto.length:1;if(Array.isArray(texto))texto=texto.join(". ");const t=arqTurno(A,texto);A.turnos.push(t);A.reveal=1}
const arqAtual=()=>S.arq.turnos[S.arq.turnos.length-1];
const arqTurnoCompleto=()=>!arqAtual()||S.arq.reveal>=arqAtual().trace.length;
function arqPasso(){const A=S.arq,cen=ARQ_CEN[A.cen];
  if(!arqTurnoCompleto()){A.reveal++;return true}
  if(A.idx<cen.msgs.length){arqEnviar(cen.msgs[A.idx++]);return true}
  return false}
function arqTurnoTodo(){if(arqTurnoCompleto()&&!arqPasso())return;S.arq.reveal=arqAtual().trace.length}
function arqTudo(){let g=0;while(g++<40){if(!arqTurnoCompleto())S.arq.reveal=arqAtual().trace.length;else if(!arqPasso())break}if(arqAtual())S.arq.reveal=arqAtual().trace.length}

function arqHtml(){
  S.arq=S.arq||arqNovo("aceita");
  const A=S.arq,cen=ARQ_CEN[A.cen],cur=arqAtual(),vis=cur?cur.trace.slice(0,A.reveal):[],ultimo=vis[vis.length-1];
  const feitos=new Set(vis.map(s=>s.no)),fim=A.idx>=cen.msgs.length&&arqTurnoCompleto();
  const pipe=ARQ_NOS.map(([k,l,ia])=>{const on=ultimo&&ultimo.no===k,done=feitos.has(k)&&!on,bad=on&&ultimo.bad;
    return `<span class="arq-node${on?" on":""}${done?" done":""}${bad?" bad":""}${cur&&!feitos.has(k)&&arqTurnoCompleto()?" skip":""}">${l}${ia?`<em>Claude</em>`:""}</span>`}).join(`<span class="arq-seta" aria-hidden="true">→</span>`);
  const chat=A.turnos.map((t,i)=>{const completo=i<A.turnos.length-1||arqTurnoCompleto();
    return `<div class="msg in"><div class="txt">${esc(t.texto)}</div></div>`+(completo?(t.resposta?`<div class="msg out bot"><span class="who">Agente</span><div class="txt">${esc(t.resposta)}</div></div>`:`<div class="msg sys">sem resposta automática: a mensagem foi para o atendente</div>`):`<div class="msg sys">processando o turno…</div>`)}).join("")||`<div class="msg sys">Clique em "Próximo passo" para a Yasmin mandar a primeira mensagem.</div>`;
  const ref=arqTurnoCompleto()?cur:A.turnos[A.turnos.length-2];
  const estado=ref?ref.estado:A.inicial;
  const eventos=A.turnos.filter((t,i)=>i<A.turnos.length-1||arqTurnoCompleto()).flatMap((t,i)=>t.ev.map(e=>[i+1,e]));
  const proxima=A.idx<cen.msgs.length?cen.msgs[A.idx]:null;
  return `<div class="panel"><div class="panel-h"><h3>Como o agente funciona por dentro</h3><span class="pill p-warn">Claude simulado · sem chave da API</span></div><div class="panel-b">
     <p class="small">Cada mensagem da cliente percorre este grafo. Só as duas caixas marcadas <b>Claude</b> usam IA, e aqui elas são simuladas (classificar por palavras-chave, redigir por textos-modelo). Todo o resto é código comum, e é ele que garante as regras: cascata, alçada, parcela mínima e transferência.</p>
     <div class="arq-pipe" role="list">${pipe}</div></div></div>
   <div class="row"><label for="arq-cen" class="small"><b>Cenário</b></label><select id="arq-cen" style="width:auto">${optList(Object.entries(ARQ_CEN).map(([k,v])=>[k,v.nome]),A.cen)}</select>
     <button class="btn" id="arq-passo" ${fim?"disabled":""}>Próximo passo</button><button class="btn ghost" id="arq-turno" ${fim?"disabled":""}>Rodar turno inteiro</button><button class="btn ghost" id="arq-tudo" ${fim?"disabled":""}>Rodar a conversa toda</button><button class="btn ghost" id="arq-reset">Reiniciar</button>
     <span class="small muted">${proxima&&arqTurnoCompleto()?`Próxima mensagem: "${esc(proxima)}"`:fim?"Fim do roteiro: escreva outra mensagem abaixo":""}</span></div>
   <div class="arq-grid">
    <div class="panel arq-chat"><div class="panel-h"><h3>WhatsApp da Yasmin</h3><span class="small muted mono">${brl(A.caso.total)} · ${A.caso.diasAtraso} dias</span></div>
      <div class="msgs">${chat}</div>
      <form class="arq-in" id="arq-form"><input id="arq-txt" placeholder="Escreva como a cliente…" aria-label="Mensagem da cliente" autocomplete="off"><button class="btn" ${arqTurnoCompleto()?"":"disabled"}>Enviar</button></form></div>
    <div class="panel"><div class="panel-h"><h3>${cur?`Turno ${A.turnos.length} · etapa ${A.reveal} de ${cur.trace.length}`:"Rastro do turno"}</h3></div><div class="panel-b">
      ${vis.length?`<ol class="arq-trace">${vis.map((s,i)=>`<li class="${s.claude?"ia":""}${s.bad?" bad":""}${i===vis.length-1?" atual":""}"><div><b>${esc(s.titulo)}</b><p class="small muted">${esc(s.txt)}</p><details ${i===vis.length-1?"open":""}><summary class="small">dados</summary><pre class="json">${esc(JSON.stringify(s.json,null,2))}</pre></details></div></li>`).join("")}</ol>`:`<p class="small muted">As etapas aparecem aqui, uma por clique.</p>`}
    </div></div>
   </div>
   <div class="grid2">
    <div class="panel"><div class="panel-h"><h3>Estado do caso</h3><span class="small muted">a linha no banco ao fim do último turno</span></div><div class="panel-b"><pre class="json">${esc(JSON.stringify({fase:estado.fase,ofertaAtual:estado.ofertaAtual?ofertaTxt(estado.ofertaAtual):null,recusas:estado.recusas.map(ofertaCurta),contestacao:estado.contestacao,irritacoes:estado.irritacoes,historico:estado.historico,principal:estado.principal,total:estado.total,diasAtraso:estado.diasAtraso},null,2))}</pre></div></div>
    <div class="panel"><div class="panel-h"><h3>Histórico único (AG-23)</h3></div><div class="panel-b">${eventos.length?`<ol class="small" style="margin:0;padding-left:20px;display:grid;gap:4px">${eventos.map(([t,e])=>`<li><span class="mono muted">T${t}</span> ${esc(e)}</li>`).join("")}</ol>`:`<p class="small muted">Vazio.</p>`}</div></div>
   </div>`;
}
function bindArq(V){
  const go=f=>()=>{f();render()};
  $("#arq-passo").onclick=go(arqPasso);$("#arq-turno").onclick=go(arqTurnoTodo);$("#arq-tudo").onclick=go(arqTudo);
  $("#arq-reset").onclick=go(()=>{S.arq=arqNovo(S.arq.cen)});
  $("#arq-cen").onchange=e=>{S.arq=arqNovo(e.target.value);render()};
  $("#arq-form").onsubmit=e=>{e.preventDefault();const t=$("#arq-txt").value.trim();if(!t||!arqTurnoCompleto())return;arqEnviar(t);render()};
  const m=V.querySelector(".arq-chat .msgs");if(m)m.scrollTop=m.scrollHeight;
  const a=V.querySelector(".arq-trace li.atual");if(a)a.scrollIntoView({block:"nearest"});
}

/* estado inicial para reiniciar a simulação de um cliente */
const SEED={ucs:JSON.parse(JSON.stringify(UCS)),tit:JSON.parse(JSON.stringify(TITULOS)),users:JSON.parse(JSON.stringify(META.users)),convs:JSON.parse(JSON.stringify(CONVS.map(c=>({c:c.c,msgs:c.msgs,lastIn:c.lastIn}))))};
function resetCliente(id){
  const c=contato(id);
  if(SEED.ucs[id])UCS[id]=JSON.parse(JSON.stringify(SEED.ucs[id]));else delete UCS[id];
  delete c.vinculo;delete c._stub;delete c.vars;
  TITULOS.forEach(t=>{if(t.c===id){const o=SEED.tit.find(x=>x.id===t.id);if(o){for(const k of Object.keys(t))delete t[k];Object.assign(t,JSON.parse(JSON.stringify(o)))}}});
  for(let i=APROV.length-1;i>=0;i--)if(APROV[i].c===id)APROV.splice(i,1);
  TAREFAS.forEach(x=>{if(x.c===id)x.feito=true});
  const conv=convOf(c);
  if(conv){const s0=SEED.convs.find(x=>x.c===id);Object.assign(conv,{msgs:s0?JSON.parse(JSON.stringify(s0.msgs)):[],status:"encerrada",setor:"—",agente:null,prot:null,flow:null,agc:null,resumo:null,ackAt:null,agcIntent:null,lastIn:s0?s0.lastIn:BASE-(c.ultimo||30)*D})}
  const u=userByTo(digits(c))||META.users[c.wa_id];
  if(u){const su=SEED.users[u.wa_id];if(su){u.lastInbound=su.lastInbound;u.mkt=[...su.mkt]}META.device[u.wa_id]=[]}
  log("app",`Simulação reiniciada para ${c.nome}: faturas, acordos, promessas, contestações e conversa voltaram ao estado inicial`);
}
function novoNumero(){
  const wa="5531"+String(900000000+Math.floor(Math.random()*99999999));
  META.users[wa]={wa_id:wa,input:wa,name:"Marina Costa",hasWA:true,lastInbound:BASE-60*D,mkt:[],reads:true};META.device[wa]=[];
  const id=Math.max(...CONTATOS.map(c=>c.id))+1;
  CONTATOS.push({id,nome:"Marina Costa (número novo)",tel:"+"+wa,cidade:"—",tags:["novo"],optin:false,ultimo:0,wa_id:wa});
  log("app",`Número desconhecido criado para teste (+${wa}). O agente vai pedir CPF/CNPJ, UC ou e-mail. Ex.: 321.654.987-11 (Yasmin)`);
  return id;
}
