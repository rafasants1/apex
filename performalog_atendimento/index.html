<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Performalog Atendimento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell com trilho de navegação, área de trabalho, console da API fixo embaixo e simulador do cliente como gaveta à direita */
/* Paleta do Performalog (lida da tela em 08/10/2026): fundo #F1F2F3, barra #191E3A, primária #1B55E2,
   info #2196F3, sucesso #8DBF42, alerta #E2A03F, perigo #DC3545, títulos #3B3F5C, texto #0E1726, borda #E0E6ED.
   Onde a cor original fica clara demais para texto pequeno, o token de texto usa um tom mais escuro do mesmo matiz. */
:root{
  --bg:#F1F2F3; --surface:#FFFFFF; --sunken:#F7F8FA; --fg:#0E1726; --muted:#515365; --line:#E0E6ED;
  --accent:#1B55E2; --accent-fg:#FFFFFF; --accent-soft:#EAF1FF;
  --ok:#5C8A1E; --ok-soft:#EEF6E2; --warn:#A8670F; --warn-soft:#FCF2E3; --bad:#DC3545; --bad-soft:#FCE8EA;
  --bubble-in:#FFFFFF; --bubble-out:#E7F3D6; --bubble-bot:#EAF1FF; --chat-bg:#E9ECF1;
  --plog-bar:#191E3A; --title:#3B3F5C; --info:#2196F3;
  --f-display:"Roboto",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Roboto",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#060818; --surface:#0E1726; --sunken:#0A1220; --fg:#E0E6ED; --muted:#9DA3BE; --line:#1B2E4B;
  --accent:#5B8DEF; --accent-fg:#060818; --accent-soft:#152448;
  --ok:#A6D35E; --ok-soft:#1A2A12; --warn:#E9B565; --warn-soft:#2E2414; --bad:#EE6B77; --bad-soft:#36191C;
  --bubble-in:#152033; --bubble-out:#1E3320; --bubble-bot:#152448; --chat-bg:#0A1220;
  --plog-bar:#191E3A; --title:#E0E6ED; --info:#4FB0F6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060818; --surface:#0E1726; --sunken:#0A1220; --fg:#E0E6ED; --muted:#9DA3BE; --line:#1B2E4B;
  --accent:#5B8DEF; --accent-fg:#060818; --accent-soft:#152448;
  --ok:#A6D35E; --ok-soft:#1A2A12; --warn:#E9B565; --warn-soft:#2E2414; --bad:#EE6B77; --bad-soft:#36191C;
  --bubble-in:#152033; --bubble-out:#1E3320; --bubble-bot:#152448; --chat-bg:#0A1220;
  --plog-bar:#191E3A; --title:#E0E6ED; --info:#4FB0F6; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:400 15px/1.5 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-display);color:var(--title);margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
code,.mono{font-family:var(--f-mono)}
code{font-size:.86em;background:var(--sunken);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.84rem}

/* shell */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding-block:18px 60px;padding-inline:14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding-inline:6px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-fg);font:700 15px var(--f-display)}
.brand b{font:700 1.05rem var(--f-display)}
.brand small{display:block;font:400 .72rem var(--f-mono);color:var(--muted)}
.navgrp{display:grid;gap:2px}
.navgrp > span{font:500 .68rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 8px 6px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:7px;border:0;background:none;cursor:pointer;text-align:left;width:100%}
.nav:hover{background:var(--sunken)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge{font:500 .7rem var(--f-mono);padding:2px 7px;border-radius:999px;background:var(--bad);color:var(--surface)}
.rail-foot{margin-top:auto;font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;display:grid;gap:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}

.main{min-width:0;display:flex;flex-direction:column;padding-bottom:46px}
body.sim-open .main{padding-right:360px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-inline:24px;padding-block:16px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.top h1{font-size:1.4rem}
.top p{color:var(--muted);font-size:.88rem;max-width:80ch}
.clock{font:500 .78rem var(--f-mono);color:var(--muted);padding:6px 9px;border:1px solid var(--line);border-radius:6px;white-space:nowrap}
.clock.shift{color:var(--warn);border-color:var(--warn)}
.content{padding-inline:24px;padding-block:20px 40px;display:grid;gap:20px;min-width:0}

/* generic */
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:7px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent)}
.btn.sm{padding:5px 9px;font-size:.84rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{justify-content:space-between}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.panel-h{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-h h3{font-size:1.02rem}
.panel-b{padding:16px;display:grid;gap:14px;min-width:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:5px;font:500 .72rem/1 var(--f-mono);padding:5px 8px;border-radius:4px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--accent-soft);color:var(--accent)}
.p-mute{border:1px solid var(--line);color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font:500 .7rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
td.r,th.r{text-align:right}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--sunken)}
.field{display:grid;gap:5px;min-width:0}
.field label,.field .lb{font-size:.82rem;font-weight:600}
.field .hint{font-size:.78rem;color:var(--muted)}
.field .err{font-size:.78rem;color:var(--bad)}
input[type=text],input[type=number],input[type=datetime-local],input[type=time],input[type=date],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
textarea{resize:vertical;min-height:96px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:4px;align-content:start}
.kpi span{font-size:.8rem;color:var(--muted)}
.kpi b{font:700 1.45rem/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.kpi small{font:400 .75rem var(--f-mono);color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(60px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:.9rem;z-index:60;max-width:calc(100% - 32px)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.callout{padding:10px 12px;border-radius:7px;font-size:.86rem;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.c-warn{background:var(--warn-soft)} .c-bad{background:var(--bad-soft)} .c-info{background:var(--accent-soft)} .c-mute{background:var(--sunken)}

/* inbox */
.inbox{display:grid;grid-template-columns:290px minmax(0,1fr) 270px;height:calc(100vh - 128px);min-height:520px}
.inbox > *{min-width:0;min-height:0}
.ilist{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column}
.ifilters{display:flex;gap:4px;padding:10px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.ifilters button{border:1px solid var(--line);background:var(--surface);padding:5px 9px;border-radius:999px;font-size:.8rem;cursor:pointer}
.ifilters button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.convs{overflow:auto;flex:1}
.conv{display:grid;gap:3px;padding:11px 14px;border:0;border-bottom:1px solid var(--line);border-left:3px solid transparent;cursor:pointer;background:none;width:100%;text-align:left}
.conv:hover{background:var(--sunken)}
.conv[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent)}
.conv-top{display:flex;justify-content:space-between;gap:8px}
.conv-top b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv-top time{font:400 .72rem var(--f-mono);color:var(--muted);white-space:nowrap}
.conv p{font-size:.84rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv .row{gap:5px}
.thread{display:flex;flex-direction:column;background:var(--chat-bg)}
.thread-h{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:74%;padding:8px 11px;border-radius:9px;font-size:.9rem;box-shadow:0 1px 0 var(--line);display:grid;gap:4px}
.msg.in{background:var(--bubble-in);align-self:flex-start}
.msg.out{background:var(--bubble-out);align-self:flex-end}
.msg.out.bot{background:var(--bubble-bot)}
.msg.sys{align-self:center;background:none;box-shadow:none;font:400 .74rem var(--f-mono);color:var(--muted);max-width:92%;text-align:center}
.msg.note{align-self:center;background:var(--warn-soft);max-width:85%;font-size:.84rem}
.msg .meta{display:flex;gap:8px;justify-content:flex-end;font:400 .68rem var(--f-mono);color:var(--muted)}
.msg .who{font:500 .66rem var(--f-mono);color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.msg .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.msg .opts{display:flex;flex-wrap:wrap;gap:4px}
.msg .opts span{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--accent)}
.msg .errline{font:400 .72rem var(--f-mono);color:var(--bad)}
.tick-read{color:var(--accent)} .tick-failed{color:var(--bad)}
.composer{background:var(--surface);border-top:1px solid var(--line);padding:10px 12px;display:grid;gap:8px}
.composer .row{flex-wrap:nowrap}
.composer input{flex:1;min-width:0}
.ctx{border-left:1px solid var(--line);background:var(--surface);overflow:auto;padding:16px;display:grid;gap:16px;align-content:start}
.ctx h4{font-size:.95rem}
.ctx dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:.85rem}
.ctx dt{color:var(--muted)}
.ctx dd{margin:0;text-align:right;min-width:0;overflow-wrap:anywhere}
.ctx section{display:grid;gap:8px}
.tags{display:flex;flex-wrap:wrap;gap:5px}

/* wizard + choices */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);font-size:.86rem;color:var(--muted);background:var(--surface)}
.step i{font:500 .72rem var(--f-mono);font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line)}
.step.on{color:var(--accent);border-color:var(--accent);font-weight:600}
.step.on i,.step.done i{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.choice{display:grid;gap:5px;padding:12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface);text-align:left;width:100%}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.choice:disabled{opacity:.5;cursor:not-allowed}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.check{display:grid;gap:8px;font-size:.88rem}
.check > div{display:flex;gap:8px;align-items:flex-start}

/* template builder + phone */
.builder{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.phone{background:var(--chat-bg);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:8px;position:sticky;top:16px}
.phone-h{font:500 .75rem var(--f-mono);color:var(--muted);text-align:center}
.wa{background:var(--bubble-in);border-radius:9px;padding:8px 10px;display:grid;gap:6px;font-size:.9rem;box-shadow:0 1px 0 var(--line)}
.wa .hd{font-weight:700}
.wa .ft{font-size:.76rem;color:var(--muted)}
.wa .bd{white-space:pre-wrap;overflow-wrap:anywhere}
.wa-btn{background:var(--bubble-in);border:0;border-radius:9px;padding:8px;text-align:center;color:var(--accent);font-weight:600;font-size:.88rem;box-shadow:0 1px 0 var(--line);width:100%}
button.wa-btn{cursor:pointer} button.wa-btn:hover{background:var(--accent-soft)}
button.wa-btn:disabled{color:var(--muted);cursor:default;background:var(--bubble-in)}
.var{background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:0 3px;font-family:var(--f-mono);font-size:.85em}
pre.json{margin:0;padding:12px 14px;background:var(--sunken);border-radius:8px;overflow-x:auto;font:400 .76rem/1.5 var(--f-mono);white-space:pre}

/* segment builder */
.rule{display:grid;grid-template-columns:minmax(120px,1.2fr) minmax(100px,1fr) minmax(100px,1.2fr) auto;gap:8px;align-items:center}
.seg-count{font:700 2rem/1 var(--f-display);font-variant-numeric:tabular-nums}

/* charts */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--f-mono)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.funnel{display:grid;gap:8px}
.fbar{display:grid;grid-template-columns:110px 1fr 70px;gap:10px;align-items:center;font-size:.86rem}
.fbar .track{background:var(--sunken);border-radius:4px;height:22px;overflow:hidden}
.fbar .fill{height:100%;background:var(--accent);border-radius:4px}
.meter{height:8px;background:var(--sunken);border-radius:999px;overflow:hidden}
.meter > div{height:100%;background:var(--accent)}

/* régua */
.regua{display:grid}
.etapa{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line)}
.etapa:last-child{border-bottom:0}
.dmark{font:600 .95rem var(--f-mono);text-align:center;padding:6px;border-radius:6px;background:var(--sunken)}
.dmark.pre{color:var(--accent)} .dmark.zero{color:var(--warn)} .dmark.pos{color:var(--bad)}

/* arquitetura */
.arch{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;align-items:stretch}
.arch .node{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface);display:grid;gap:6px;align-content:start;min-width:0}
.arch .node b{font-family:var(--f-display);font-size:1rem}
.arch .node.mid{border-color:var(--accent)}
.arch .link{display:grid;align-content:center;gap:6px;padding-inline:8px;font:400 .72rem/1.3 var(--f-mono);color:var(--muted);text-align:center}
.arch-row{display:grid;grid-template-columns:minmax(0,1fr) 120px minmax(0,1.1fr) 120px minmax(0,1.3fr);align-items:stretch}
.seq{display:grid;gap:0;counter-reset:sq}
.seq li{list-style:none;display:grid;grid-template-columns:28px 120px 1fr;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:start;counter-increment:sq}
.seq li::before{content:counter(sq);font:500 .76rem/26px var(--f-mono);text-align:center;width:26px;height:26px;border:1px solid var(--line);border-radius:50%}
.seq li:last-child{border-bottom:0}
.seq .actor{font:500 .74rem var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--accent);padding-top:4px}
.seq ul{margin:0;padding-left:0}

/* console */
.console{position:fixed;left:232px;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
body.sim-open .console{right:360px}
.con-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 14px;min-height:44px}
.con-bar b{font-family:var(--f-display)}
.con-list{overflow:auto;height:38vh;border-top:1px solid var(--line)}
.con-list[hidden]{display:none}
.ce{border-bottom:1px solid var(--line)}
.ce summary{display:grid;grid-template-columns:70px 78px 1fr;gap:10px;padding:7px 14px;cursor:pointer;font:400 .78rem var(--f-mono);align-items:baseline;list-style:none}
.ce summary::-webkit-details-marker{display:none}
.ce summary:hover{background:var(--sunken)}
.ce .k{font-weight:500;text-transform:uppercase;font-size:.7rem;letter-spacing:.05em}
.k-req{color:var(--accent)} .k-res{color:var(--ok)} .k-err{color:var(--bad)} .k-wh{color:var(--warn)} .k-app{color:var(--muted)} .k-gw{color:var(--ok)}
.ce .ti{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ce pre.json{border-radius:0}
.ce .hdrs{font:400 .72rem var(--f-mono);color:var(--muted);padding:6px 14px;background:var(--sunken);border-bottom:1px dashed var(--line);overflow-wrap:anywhere}
.cf{border:1px solid var(--line);background:var(--surface);padding:3px 8px;border-radius:999px;font-size:.76rem;cursor:pointer}
.cf[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* simulador do cliente */
.sim{position:fixed;top:0;right:0;bottom:0;width:360px;z-index:40;background:var(--chat-bg);border-left:1px solid var(--line);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sim-h{background:var(--surface);border-bottom:1px solid var(--line);padding:12px;display:grid;gap:8px}
.sim-msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.sb{max-width:88%;display:grid;gap:4px}
.sb.biz{align-self:flex-start}
.sb.me{align-self:flex-end}
.sb .bub{padding:8px 10px;border-radius:9px;font-size:.88rem;box-shadow:0 1px 0 var(--line);white-space:pre-wrap;overflow-wrap:anywhere;display:grid;gap:5px}
.sb.biz .bub{background:var(--bubble-in)} .sb.me .bub{background:var(--bubble-out)}
.sb small{font:400 .66rem var(--f-mono);color:var(--muted)}

function graph(method,path,body){
  log("req",`${method} /${CFG.ver}/${path}`,body,`Authorization: Bearer ${CFG.token}\nContent-Type: application/json`);
  let res;
  if(path===`${CFG.phoneId}/messages`) res=META.messages(body);
  else if(path===`${CFG.waba}/message_templates`) res=META.createTemplate(body);
  else res=graphErr(100,"Unsupported post request","Caminho desconhecido");
  log(res.status<300?"res":"err",`HTTP ${res.status} · ${path.split("/").pop()}`,res.json);
  return res;
}

META.messages=body=>{
  if(body.messaging_product!=="whatsapp") return graphErr(100,"Invalid parameter","messaging_product deve ser \"whatsapp\"");
  if(body.status==="read") return {status:200,json:{success:true}};
  const u=userByTo(body.to);
  if(!u) return graphErr(100,"Invalid parameter","Parâmetro 'to' inválido");
  let cat="service";
  if(body.type==="template"){
    const t=META.tpls[body.template?.name];
    if(!t||t.status!=="APPROVED"||t.language!==body.template.language?.code) return graphErr(132001,"Template name does not exist in the translation",`template name (${body.template?.name}) does not exist in ${body.template?.language?.code}`);
    const sent=(body.template.components||[]).find(c=>c.type==="body")?.parameters?.length||0, exp=paramCount(t.body);
    if(sent!==exp) return graphErr(132000,"Number of parameters does not match the expected number of params",`body: number of localizable_params (${sent}) does not match the expected number of params (${exp})`);
    cat=t.category.toLowerCase();
  }
  if(body.type==="interactive"){
    const it=body.interactive;
    if(it.type==="button"&&(it.action.buttons.length>3||it.action.buttons.some(b=>b.reply.title.length>20))) return graphErr(100,"Invalid parameter","Botões: no máximo 3, com até 20 caracteres");
    if(it.type==="list"&&it.action.sections.flatMap(s=>s.rows).some(r=>r.title.length>24)) return graphErr(100,"Invalid parameter","Linhas da lista: título com até 24 caracteres");
  }
  const id=wamid(); META.out[id]={to:u.wa_id,body};
  META.deliver(u,body,id,cat);
  return {status:200,json:{messaging_product:"whatsapp",contacts:[{input:body.to,wa_id:u.wa_id}],messages:[body.type==="template"?{id,message_status:"accepted"}:{id}]}};
};

META.deliver=(u,body,id,cat)=>{
  const isT=body.type==="template", open=windowOpen(u);
  let err=null;
  if(!u.hasWA) err=ERR[131026];
  else if(!isT&&!open) err=ERR[131047];
  else if(cat==="marketing"&&u.mkt.filter(ts=>now()-ts<D).length>=2) err=ERR[131049];
  if(isT&&!open) META.uniq.set(u.wa_id,now());           // conversa iniciada pela empresa conta no limite do portfólio
  if(cat==="marketing"&&!err) u.mkt.push(now());
  const pricing=(!isT||(cat==="utility"&&open))
    ?{billable:false,pricing_model:"PMP",type:"free_customer_service",category:isT?cat:"service"}
    :{billable:true,pricing_model:"PMP",type:"regular",category:cat};
  const st=(status,extra={})=>META.emit("messages",{messaging_product:"whatsapp",metadata:metadata(),statuses:[{id,status,timestamp:sec(),recipient_id:u.wa_id,...extra}]});
  if(err){later(900,()=>st("failed",{errors:[{...err,href:"/documentation/business-messaging/whatsapp/support/error-codes"}]}));return}
  later(500,()=>st("sent",{pricing}));
  later(1300,()=>{META.device[u.wa_id].push({dir:"biz",id,body,ts:now()});st("delivered",{pricing});
    if(Math.random()<.15) later(400,()=>st("delivered",{pricing}));            // a Meta pode reenviar o mesmo webhook
  });
  if(u.reads) later(2400+Math.random()*1500,()=>st("read"));
};

META.createTemplate=body=>{
  if(!/^[a-z0-9_]{1,512}$/.test(body.name)) return graphErr(100,"Invalid parameter","name: use letras minúsculas, números e _");
  if(META.tpls[body.name]&&META.tpls[body.name].status!=="REJECTED") return graphErr(100,"Invalid parameter",`Já existe conteúdo para ${body.name} em ${body.language}`);
  const comp=t=>body.components.find(c=>c.type===t);
  const b=comp("BODY")?.text||"";
  const id=String(1e15+Math.floor(Math.random()*9e14));
  META.tpls[body.name]={id,name:body.name,language:body.language,category:body.category,status:"PENDING",body:b,header:comp("HEADER")?.text||"",footer:comp("FOOTER")?.text||"",buttons:(comp("BUTTONS")?.buttons||[]).map(x=>x.text)};
  later(2600,()=>{
    const t=META.tpls[body.name];
    const caps=(b.match(/\b[A-ZÁÉÍÓÚÃÕÇ]{4,}\b/g)||[]).length;
    let ev="APPROVED",reason="NONE";
    if(/!!!|ganhe|prêmio|grátis agora/i.test(b)||caps>=3){ev="REJECTED";reason="SCAM"}
    else if(/^\s*\{\{\d+\}\}|\{\{\d+\}\}[.!?\s]*$/.test(b)){ev="REJECTED";reason="INVALID_FORMAT"}
    t.status=ev;
    META.emit("message_template_status_update",{event:ev,message_template_id:+t.id,message_template_name:t.name,message_template_language:t.language,reason});
    if(ev==="APPROVED"&&t.category==="UTILITY"&&/desconto extra|promo|oferta|% off|indique/i.test(b)){
      later(1500,()=>{t.category="MARKETING";META.emit("template_category_update",{message_template_id:+t.id,message_template_name:t.name,message_template_language:t.language,previous_category:"UTILITY",new_category:"MARKETING"})});
    }
  });
  return {status:200,json:{id,status:"PENDING",category:body.category}};
};

   NOSSO BACKEND
   Recebe webhooks, guarda estado, roda o chatbot, as campanhas e a régua.
   ========================================================================= */
const APP={seen:new Set(),idx:{},ledger:[],payments:[]};
const RANK={accepted:0,sent:1,delivered:2,read:3};

APP.webhook=p=>{
  const ch=p.entry[0].changes[0], v=ch.value;
  const what=ch.field!=="messages"?ch.field:v.statuses?`status: ${v.statuses[0].status}`:`mensagem: ${v.messages[0].type}`;
  log("wh",`POST ${new URL(CFG.callback).pathname} · ${what}`,p,`X-Hub-Signature-256: sha256=${hex(64)}\nContent-Type: application/json`);
  // 1) validar assinatura com o app secret  2) responder 200 rápido  3) processar em fila
  for(const e of p.entry) for(const c of e.changes){
    const val=c.value;
    if(c.field==="messages"){(val.messages||[]).forEach(m=>APP.onMessage(m,val.contacts?.[0]));(val.statuses||[]).forEach(APP.onStatus)}
    if(c.field==="message_template_status_update") APP.onTplStatus(val);
    if(c.field==="template_category_update") APP.onTplCategory(val);
  }
};

APP.onStatus=s=>{
  const key=s.id+":"+s.status;
  if(APP.seen.has(key)){log("app",`Webhook repetido ignorado (${s.status}). Idempotência pela chave wamid + status.`);return}
  APP.seen.add(key);
  const rec=APP.idx[s.id]; if(!rec) return;
  if(s.pricing&&!rec.pricing){rec.pricing=s.pricing;rec.cost=s.pricing.billable?PRECO[s.pricing.category]||0:0;
    APP.ledger.push({id:s.id,origin:rec.origin,cat:s.pricing.category,type:s.pricing.type,cost:rec.cost,ts:now()})}
  if(s.status==="failed"){
    rec.status="failed";rec.msg.status="failed";rec.msg.err=s.errors[0];
    const code=s.errors[0].code;
    log("app",`Falha ${code}: ${ERR_PT[code]||s.errors[0].title}`);
    if(rec.camp){rec.camp.falha++;rec.camp.erros[code]=(rec.camp.erros[code]||0)+1;(rec.camp.falhos=rec.camp.falhos||[]).push(rec.conv.c)}
    if(code===131047) rec.conv.msgs.push({dir:"sys",text:"A janela de 24 horas fechou. Envie um modelo aprovado para retomar a conversa.",ts:now()});
    if(code===131026) {const c=contato(rec.conv.c);if(!c.tags.includes("sem-whatsapp"))c.tags.push("sem-whatsapp")}
    return;
  }
  const from=RANK[rec.status], to=RANK[s.status];
  if(to<=from){log("app",`Status "${s.status}" chegou depois de "${rec.status}". Status nunca regride.`);return}
  if(rec.camp){ if(from<1&&to>=1)rec.camp.sent++; if(from<2&&to>=2)rec.camp.ent++; if(to>=3)rec.camp.lid++ }
  rec.status=s.status; rec.msg.status=s.status;
};

APP.onTplStatus=v=>{
  const t=tplByName(v.message_template_name); if(!t) return;
  t.status=v.event; t.motivo=v.reason!=="NONE"?v.reason:null;
  log("app",`Template ${t.nome}: ${v.event}${t.motivo?" ("+t.motivo+")":""}`);
  toast(`Template ${t.nome} ${v.event==="APPROVED"?"aprovado":"rejeitado"} pela Meta`);
};
APP.onTplCategory=v=>{
  const t=tplByName(v.message_template_name); if(!t) return;
  t.cat=v.new_category; t.reclass=v.previous_category;
  log("app",`Meta mudou ${t.nome} de ${v.previous_category} para ${v.new_category}. O custo por envio mudou.`);
  toast(`${t.nome} reclassificado para Marketing`);
};

APP.post=(conv,body,display,{from="agente",origin="atendimento",camp=null,titulo=null}={})=>{
  const res=graph("POST",`${CFG.phoneId}/messages`,body);
  if(res.status!==200){
    const e=res.json.error;
    conv.msgs.push({dir:"sys",text:`Envio recusado pela API · ${e.code}: ${ERR_PT[e.code]||e.message}`,ts:now()});
    return null;
  }
  const c=contato(conv.c), wa=res.json.contacts[0].wa_id;
  if((c.wa_id||digits(c))!==wa){log("app",`A Meta devolveu wa_id ${wa} para o número ${body.to}. Gravando o wa_id: é ele que vem nos webhooks.`)}
  c.wa_id=wa;

function arestas(n){

  switch(n.tipo){
    case "menu": n.opcoes.forEach((o,i)=>add(o.next,o.titulo,`opcoes.${i}.next`)); add(n.fallback,"não entendeu","fallback"); break;
    case "captura": add(n.next,"válido","next"); add(n.falha,"inválido","falha"); break;
    case "condicao": n.regras.forEach((r,i)=>add(r.next,`${r.var.split(".").pop()} ${r.op} ${r.valor}`,`regras.${i}.next`)); add(n.senao,"senão","senao"); break;
    case "http": add(n.next,"ok","next"); add(n.erro,"erro","erro"); break;
    case "ia": add(n.resolvido,"resolveu","resolvido"); add(n.transferir,"transferir","transferir"); break;
    case "agente_cobranca": add(n.concluido,"resolvido","concluido"); break;
    case "lgpd_verificar": add(n.sim,"consentiu","sim"); add(n.nao,"sem consentimento","nao"); break;
    case "lgpd_autorizar": add(n.aceito,"aceito","aceito"); add(n.recusou,"recusou","recusou"); break;
    case "mensagem": if(n.subtipo==="template"&&n.ramos) Object.entries(n.ramos).forEach(([b,to])=>add(to,b,`ramos.${b}`)); add(n.next,n.subtipo==="template"&&n.ramos&&Object.keys(n.ramos).length?"sem botão":"","next"); break;
    case "transferir": case "fim": case "lgpd_bloquear": break;
    default: add(n.next,"","next");
  }
  return E;
}

const ENGINE={};
const MAX_PASSOS=40;
ENGINE.start=(conv,c,flowId,nodeId,origem)=>{
  const F=FLOWS[flowId];
  const ex={id:EXECS.length+1,conv:conv.id,c:c.id,flow:flowId,inicio:now(),fim:null,status:"em andamento",caminho:[],origem};
  EXECS.unshift(ex);
  conv.flow={flowId,node:nodeId||F.start,vars:{},tries:0,waiting:false,turnos:0,hist:[],exec:ex.id,done:false,textoInicial:conv.lastText||""};
  log("app",`Fluxo "${F.nome}" iniciado em "${F.nodes[conv.flow.node]?.titulo||conv.flow.node}" · origem: ${origem}`);
  ENGINE.run(conv,c,null);
};
ENGINE.onMessage=(conv,c,m,text,payload)=>{
  APP.markRead(m.id,true);
  const palavras=IP.palavrasTransbordo.split(",").map(s=>s.trim().toLowerCase()).filter(Boolean);
  if(palavras.some(p=>text.toLowerCase().includes(p))&&!(conv.flow&&!conv.flow.done&&["agente_cobranca"].includes(FLOWS[conv.flow.flowId]?.nodes[conv.flow.node]?.tipo))){handoff(conv,IP.equipePadrao,"palavra de transbordo");return}
  if(!conv.flow||conv.flow.done){later(700,()=>ENGINE.start(conv,c,IP.fluxoPadrao,null,"mensagem recebida"));return}
  if(conv.flow.wakeAt){log("app","Fluxo aguardando cronômetro; mensagem registrada");return}
  later(700,()=>ENGINE.run(conv,c,{text,payload,m}));
};
ENGINE.run=(conv,c,input)=>{
  const f=conv.flow; if(!f||f.done) return;
  const F=FLOWS[f.flowId], ex=EXECS.find(x=>x.id===f.exec);
  for(let i=0;i<MAX_PASSOS;i++){
    const n=F.nodes[f.node];
    if(!n){log("app",`Nó "${f.node}" não existe no fluxo ${F.nome}. Transferindo.`);handoff(conv,IP.equipePadrao,"erro no fluxo");return}
    if(!f.waiting&&ex&&ex.caminho.at(-1)!==n.id) ex.caminho.push(n.id);
    const r=ENGINE.exec(n,conv,c,f.waiting?input:null);
    if(r.wait){f.waiting=true;return}
    f.waiting=false;f.tries=0;input=null;
    if(r.end){f.done=true;if(ex&&ex.status==="em andamento"){ex.status=r.end;ex.fim=now()}return}
    if(!r.next){log("app",`Nó "${n.titulo}" sem próximo passo. Fluxo encerrado.`);f.done=true;if(ex){ex.status="concluída";ex.fim=now()}return}
    f.node=r.next;
  }
  log("app","Fluxo interrompido: mais de "+MAX_PASSOS+" passos seguidos (possível laço)");handoff(conv,IP.equipePadrao,"laço no fluxo");
};
const VALIDA={texto:v=>v.trim().length>0,numero:v=>/^-?\d+([.,]\d+)?$/.test(v.trim()),email:v=>/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(v.trim()),telefone:v=>/^\d{10,13}$/.test(v.replace(/\D/g,"")),

function guardaVar(conv,c,codigo,valor){
  const def=VARS.find(v=>v.codigo===codigo);
  if(def&&def.escopo==="contato"){(c.vars=c.vars||{})[codigo]=valor}else conv.flow.vars[codigo]=valor;
  log("app",`Variável ${codigo} = "${valor}" (${def?def.escopo:"conversa"})`);
}
function avalia(r,vars){
  const v=String(vars[r.var]??""), x=String(r.valor??"");
  switch(r.op){case "=":return v.toLowerCase()===x.toLowerCase();case "≠":return v.toLowerCase()!==x.toLowerCase();case "contém":return v.toLowerCase().includes(x.toLowerCase());
    case ">":return parseFloat(v.replace(",","."))>parseFloat(x.replace(",","."));case "<":return parseFloat(v.replace(",","."))<parseFloat(x.replace(",","."));case "existe":return v!=="";case "não existe":return v===""}
  return false;
}
ENGINE.exec=(n,conv,c,input)=>{

      if(["imagem","documento","audio","video"].includes(n.subtipo)){
        const k={imagem:"image",documento:"document",audio:"audio",video:"video"}[n.subtipo];
        APP.post(conv,{messaging_product:"whatsapp",recipient_type:"individual",to:toOf(c),type:k,[k]:{link:n.url||"https://cdn.performaenergy.com.br/arquivo.pdf",...n.texto&&k!=="audio"?{caption:I(n.texto)}:{},...k==="document"?{filename:(n.url||"arquivo.pdf").split("/").pop()}:{}}},{text:`[${n.subtipo}] ${I(n.texto||"")}`},{from:"bot"});
        return {next:n.next};
      }
      APP.text(conv,I(n.texto),{from:"bot"});return {next:n.next};
    }
    case "menu":{
      const opts=n.opcoes.map((o,i)=>({id:`${n.id}:${i}`,title:o.titulo.slice(0,n.formato==="botoes"?20:24),description:(o.desc||"").slice(0,72),next:o.next}));

        else APP.list(conv,I(n.texto),n.botao||"Ver opções",opts.map(o=>({id:o.id,title:o.title,description:o.description})),{from:"bot"});
        if(IP.autoProtocoloMin>0) f.autoAt=now()+IP.autoProtocoloMin*MIN;
        return {wait:true};
      }
      f.autoAt=null;
      const t=input.text.trim().toLowerCase();
      const o=opts.find(o=>o.id===input.payload)||opts[+t-1]||opts.find(o=>o.title.toLowerCase()===t);
      if(o) return {next:o.next};
      f.tries++;
      if(f.tries>=n.tentativas) return {next:n.fallback};
      APP.text(conv,I(n.erro),{from:"bot"});return {wait:true};
    }
    case "captura":{
      if(!input){APP.text(conv,I(n.pergunta),{from:"bot"});return {wait:true}}
      const ok=(VALIDA[n.dado]||VALIDA.texto)(input.text,n);
      if(ok){guardaVar(conv,c,n.variavel,input.text.trim());return {next:n.next}}
      f.tries++;
      if(f.tries>=n.tentativas){log("app",`Captura "${n.titulo}" falhou ${f.tries} vezes`);return {next:n.falha||n.next}}
      APP.text(conv,I(n.erro),{from:"bot"});return {wait:true};
    }
    case "condicao":{
      const vars=allVars(conv,c);
      const r=n.regras.find(r=>avalia(r,vars));
      log("app",`Condição "${n.titulo}": ${r?`${r.var} ${r.op} ${r.valor}`:"senão"}`);

    case "cronometro":
      if(!f.wakeAt){f.wakeAt=now()+n.minutos*MIN;log("app",`Cronômetro: fluxo retoma em ${n.minutos} min`);return {wait:true}}

    case "http":{
      if(!/^https:\/\/.+\..+/.test(n.url)){log("app",`Requisição HTTP sem URL válida em "${n.titulo}"`);return {next:n.erro||n.next}}

      log("req",`HTTP · ${n.metodo} ${n.url}`,body,"Content-Type: application/json\nAuthorization: Bearer (credencial da integração)");
      const res=/crm/.test(n.url)?{id:"lead_"+hex(8),status:"created"}:{ok:true,id:hex(10)};
      log("res","HTTP 201 · "+new URL(n.url).host,res);

    }
    case "ia":{
      const ag=agente(n.agente);
      if(!ag){log("app","Agente de IA não encontrado");return {next:n.transferir}}
      if(!input){if(n.saudacao)APP.text(conv,I(n.saudacao),{from:"bot"});f.turnos=0;f.hist=[];return {wait:true}}
      if(/obrigad|resolveu|resolvido|voltou|funcionou|era isso|valeu/i.test(input.text)){f.hist=[];return {next:n.resolvido}}
      const r=iaResponder(ag,input.text,conv,c,f.hist);
      if(r.fora){f.fora=(f.fora||0)+1;
        if(f.fora>=ESCOPO.limite){log("app",`${f.fora}ª mensagem seguida fora do escopo: transfere (AU-87)`);return {next:n.transferir}}
        APP.text(conv,r.texto,{from:"bot"});return {wait:true}}
      f.fora=0;f.turnos++;
      f.hist.push({role:"user",content:input.text},{role:"assistant",content:r.texto});
      if(r.transferir){log("app",`IA decidiu transferir (confiança ${r.confianca.toFixed(2)} < ${ag.confianca} ou regra da base)`);if(r.confianca>=ag.confianca)APP.text(conv,r.texto,{from:"bot"});return {next:n.transferir}}
      APP.text(conv,r.texto,{from:"bot"});
      if(f.turnos>=n.maxTurnos){log("app","IA atingiu o limite de turnos");return {next:n.transferir}}
      return {wait:true};
    }
    case "agente_cobranca":{const r=AGC.step(conv,c,input);if(r.next===true)return {next:n.concluido};if(r.end)return r;return {wait:true}}
    case "lgpd_verificar": return {next:c.lgpd?n.sim:n.nao};
    case "lgpd_autorizar":{
      if(!input){APP.buttons(conv,I(n.texto),[{id:n.id+":ok",title:"Aceito"},{id:n.id+":no",title:"Não aceito"}],{from:"bot"});return {wait:true}}
      const ok=input.payload===n.id+":ok"||/^aceito$/i.test(input.text.trim());
      if(ok){c.lgpd=true;c.lgpdEm=now();log("app","Consentimento LGPD registrado com data, hora e canal")}

      APP.text(conv,I(n.texto),{from:"bot"});conv.status="encerrada";return {end:"concluída"};
    case "transferir": handoff(conv,n.equipe,n.motivo||n.titulo); return {end:"transferida"};

      conv.status="encerrada";conv.msgs.push({dir:"sys",text:"Resolvido pelo bot",ts:now()});return {end:"concluída"};
  }
  return {next:n.next};
};

/* início por ponto de inicialização (API, agendamento ou lista) */
function iniciarPorPonto(pontoId,c,origem){
  const p=PONTOS.find(x=>x.id===pontoId);
  if(!p) return {ok:false,motivo:"Ponto de inicialização inexistente"};
  const F=FLOWS[p.flow], n=F?.nodes[p.node];
  if(!n) return {ok:false,motivo:"Ponto de inicialização não existe no fluxo atual"};
  if(!F.ativo) return {ok:false,motivo:"Fluxo desativado"};
  const conv=ensureConv(c);
  if(["bot","fila","atendimento"].includes(conv.status)) return {ok:false,motivo:"Interação em andamento pré-existente encontrada"};
  if(!c.optin) return {ok:false,motivo:"Contato sem opt-in"};
  const u=userByTo(toOf(c))||META.users[c.wa_id];
  const abreComTemplate=n.tipo==="mensagem"&&n.subtipo==="template";
  if((!u||!windowOpen(u))&&!abreComTemplate) return {ok:false,motivo:"Janela de 24 h fechada: o ponto precisa começar com um template"};
  conv.status="bot";conv.prot=newProt();conv.agente=null;conv.setor="—";conv.msgs.push({dir:"sys",text:`Protocolo ${conv.prot} aberto por automação (${p.titulo})`,ts:now()});
  ENGINE.start(conv,c,p.flow,p.node,origem);
  return {ok:true};
}

/* relógio da automação: agendamentos, cronômetros, protocolo automático e inatividade */
setInterval(()=>{
  let mudou=false;
  AGENDAMENTOS.filter(a=>a.status==="agendado"&&a.quando<=now()).forEach(a=>{
    const r=iniciarPorPonto(a.ponto,contato(a.c),"agendamento #"+a.id);
    a.status=r.ok?"iniciado":"falha";a.motivo=r.ok?"":r.motivo;mudou=true;
    log("app",`Agendamento #${a.id} (${contato(a.c).nome}): ${r.ok?"iniciado":"falha · "+r.motivo}`);
  });
  CONVS.forEach(conv=>{
    const f=conv.flow, c=contato(conv.c);
    if(f&&!f.done&&f.wakeAt&&f.wakeAt<=now()){ENGINE.run(conv,c,null);mudou=true}
    if(f&&!f.done&&f.autoAt&&f.autoAt<=now()&&conv.status==="bot"){f.autoAt=null;handoff(conv,IP.equipePadrao,`sem escolha no menu por ${IP.autoProtocoloMin} min`);mudou=true}
    if(IP.encerrarSemRespostaH>0&&["fila","atendimento","bot"].includes(conv.status)&&now()-conv.lastIn>IP.encerrarSemRespostaH*H&&now()-(conv.msgs.at(-1)?.ts||0)>IP.encerrarSemRespostaH*H){
      conv.status="encerrada";if(conv.flow){conv.flow.done=true;execFim(conv,"abandonada")}
      conv.msgs.push({dir:"sys",text:`Encerrada por inatividade: ${IP.encerrarSemRespostaH} h sem resposta do contato`,ts:now()});mudou=true;
    }
  });
  if(mudou) refresh();
},1000);

const CAMPOS={tag:{label:"Tag",ops:["contém","não contém"]},cidade:{label:"Cidade",ops:["é","não é"]},optin:{label:"Opt-in WhatsApp",ops:["é"]},dias:{label:"Dias sem contato",ops:["≥","≤"]},atraso:{label:"Fatura em atraso",ops:["é"]}};
const emAtraso=c=>TITULOS.some(t=>t.c===c.id&&t.status==="aberto"&&t.venc<now());
function passa(c,[campo,op,val]){
  switch(campo){
    case "tag": return op==="contém"?c.tags.includes(val):!c.tags.includes(val);
    case "cidade": return op==="é"?c.cidade===val:c.cidade!==val;
    case "optin": return c.optin===(val==="sim");
    case "dias": return op==="≥"?c.ultimo>=+val:c.ultimo<=+val;
    case "atraso": return emAtraso(c)===(val==="sim");
  } return true;
}
const filtra=regras=>CONTATOS.filter(c=>regras.every(r=>passa(c,r)));
/* quem não tem opt-in nunca recebe disparo, mesmo que o segmento não filtre */
const alcancaveis=regras=>filtra(regras).filter(c=>c.optin);
/* consentimento por finalidade: opt-in do contrato e nenhuma revogação daquela finalidade (OP-45) */
const fin=(c,k)=>!!c.optin&&!(c.finsOff||[]).includes(k);
const finDoModelo=T=>T.cat==="MARKETING"?"marketing":"comunicados";

/* =========================================================================
   COBRANÇA
   ========================================================================= */
const diasAtraso=t=>Math.floor((now()-t.venc)/D);
function faixa(t){
  if(t.status==="pago") return ["Pago","p-ok"];
  if(t.status==="negociacao") return ["Em negociação","p-info"];
  if(t.status==="conferencia") return ["Conferindo pagamento","p-info"];
  if(t.status==="cancelado") return ["Cancelado","p-mute"];
  const d=diasAtraso(t);
  if(d<0) return ["A vencer","p-mute"];
  if(d===0) return ["Vence hoje","p-warn"];
  if(d<=15) return ["1–15 dias","p-warn"];
  if(d<=30) return ["16–30 dias","p-bad"];
  return ["30+ dias","p-bad"];
}
/* ---------- calendário de envio ---------- */
const isoDay=ms=>{const d=new Date(ms);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const atHour=(ms,hhmm)=>{const d=new Date(ms),[h,m]=hhmm.split(":").map(Number);d.setHours(h,m,0,0);return d.getTime()};
const diaPermitido=ms=>COB.dias.includes(new Date(ms).getDay())&&!(COB.feriados&&FERIADOS.includes(isoDay(ms)));
const motivoBloqueio=ms=>!COB.dias.includes(new Date(ms).getDay())?"dia da semana bloqueado":COB.feriados&&FERIADOS.includes(isoDay(ms))?"feriado":"";
/* data real do envio: vencimento + d dias, ajustado pela política quando cai em dia bloqueado */
function dataEnvio(venc,d){
  let ms=atHour(venc+d*D,COB.hIni);
  if(COB.politica==="manter"||!COB.dias.length) return {ms,ajuste:""};
  const orig=ms, step=COB.politica==="adiar"?D:-D;
  for(let i=0;i<14&&!diaPermitido(ms);i++) ms+=step;
  return {ms,ajuste:ms!==orig?`${COB.politica==="adiar"?"adiado":"antecipado"} (${motivoBloqueio(orig)} em ${ddmm(orig)})`:""};
}
function janelaEnvioAberta(ms=now()){
  if(!diaPermitido(ms)) return false;
  return ms>=atHour(ms,COB.hIni)&&ms<atHour(ms,COB.hFim);
}
function proximaAbertura(ms=now()){
  for(let i=0;i<15;i++){
    const dia=ms+i*D; if(!diaPermitido(dia)) continue;
    const ini=atHour(dia,COB.hIni), fim=atHour(dia,COB.hFim);
    if(i===0){if(ms<ini)return ini;if(ms<fim)return ms;continue}
    return ini;
  }
  return null;
}
const reguaOrdenada=()=>[...REGUA].sort((a,b)=>a.d-b.d);
/* etapa da régua que vale agora: a última cuja data de envio já chegou */
function etapaAtual(t){if(t.status!=="aberto")return null;return reguaOrdenada().filter(e=>e.ativo&&dataEnvio(t.venc,e.d).ms<=now()).pop()||null}
function proximaEtapa(t){if(t.status!=="aberto")return null;return reguaOrdenada().find(e=>e.ativo&&dataEnvio(t.venc,e.d).ms>now())||null}
const dLabel=x=>x===0?"No dia":x<0?`${-x} d antes`:`${x} d depois`;

/* Ordem da fila de cobrança: quem o financeiro deve olhar primeiro.
   Recebe um título {valor, venc, envios, status, c} e devolve um número; maior = mais urgente. */
function prioridadeCobranca(t){
  /* Q-CB9: dias de atraso combinados com valor. Cada dia de atraso pesa como R$ 10 de dívida,
     para um título muito atrasado e pequeno não ficar sempre atrás de um grande recém-vencido. */
  return Math.max(0,diasAtraso(t))*10+t.valor;
}

/* roda a régua: envia o template da etapa para cada título que ainda não recebeu essa etapa */
function executarRegua(){
  if(!COB.salvo){log("app","Régua não executada: há alterações em rascunho. Publique ou descarte.");toast("Publique ou descarte o rascunho da régua antes de executar");return}
  if(!janelaEnvioAberta()){
    const p=proximaAbertura();
    log("app",`Régua não executada: fora da janela de envio (${COB.hIni}–${COB.hFim}, dias configurados). Próxima abertura: ${p?new Date(p).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}):"nenhuma"}`);
    toast("Fora da janela de envio configurada");return;
  }
  let env=0,pul=0;
  TITULOS.forEach(t=>{
    const e=etapaAtual(t); if(!e||t.sent[e.d]) return;
    const c=contato(t.c);
    if(!fin(c,"cobranca")){pul++;log("app",`${t.id}: contato sem consentimento para cobrança, régua não envia (cobrança manual)`);return}
    const semana=Object.values(t.sentAt||{}).filter(ts=>now()-ts<7*D).length;
    if(semana>=COB.maxPorSemana){log("app",`${t.id}: já recebeu ${semana} cobranças em 7 dias (limite ${COB.maxPorSemana}). Pulado.`);return}
    if(suspensa(t)){log("app",`${t.id}: régua suspensa (promessa ou contestação em andamento)`);return}
    if(e.tipo==="negativacao"){t.sent[e.d]=1;const u=ucOf(c);u.neg="elegível";hist(c,`Régua ${dLabel(e.d)}: débito entrou no fluxo de negativação`);if(e.canais?.includes("email"))enviarEmail(c,"Aviso de negativação",`A fatura ${t.id} segue em aberto e entrou no fluxo de negativação.`);const cv=ensureConv(c);reopen(cv);handoff(cv,"Cobrança",`régua ${dLabel(e.d)}: iniciar negativação`);env++;return}
    if(e.humano||!e.tpl){t.sent[e.d]=1;const cv=ensureConv(c);reopen(cv);handoff(cv,"Cobrança",`régua ${dLabel(e.d)}: ${e.acao}`);return}
    const conv=ensureConv(c), T=tpl(e.tpl);
    if(!T||T.status!=="APPROVED"){log("app",`${t.id}: template da etapa ${dLabel(e.d)} não está aprovado. Pulado.`);return}
    (t.sentAt=t.sentAt||{})[e.d]=now();
    const params=[c.nome.split(" ")[0],t.competencia||"10/2026",ddmm(t.venc)].slice(0,paramCount(T.body));
    const id=APP.template(conv,T,params,{origin:"cobranca",titulo:t});
    if(id){t.sent[e.d]=1;t.envios++;env++;hist(c,`Régua ${dLabel(e.d)}: ${e.acao}`);
      if(e.canais?.includes("email")){let tx=T.body;params.forEach((v,i)=>tx=tx.split(`{{${i+1}}}`).join(v));enviarEmail(c,T.header||e.acao,tx)}}
  });
  toast(env?`Régua executada: ${env} envio(s)`:"Nenhum título precisa de envio agora"+(pul?` · ${pul} sem opt-in`:""));
}
/* webhook do gateway de pagamento (Pix/boleto) */
function pagamentoGateway(t){
  const ev={event:"PAYMENT_RECEIVED",charge_id:"ch_"+hex(12),external_reference:t.id,amount:t.valor,method:"pix",paid_at:new Date(now()).toISOString()};
  log("gw","POST /webhooks/pagamentos · PAYMENT_RECEIVED",ev,"X-Gateway-Signature: "+hex(40));
  t.status="pago";t.pagoEm=now();APP.payments.push({id:t.id,valor:t.valor,ts:now(),apósMensagem:t.envios>0});
  log("app",`Stop-loss: régua encerrada para ${t.id}`);
  const c=contato(t.c),conv=ensureConv(c),u=META.users[toOf(c)]||userByTo(digits(c));
  if(!fin(c,"cobranca")) return;
  if(!COB.eventos.pago.ativo){log("app","Aviso de pagamento desativado na configuração");return}
  if(u&&windowOpen(u)) APP.text(conv,`${c.nome.split(" ")[0]}, recebemos o pagamento de ${brl(t.valor)} da fatura ${t.id}. Obrigado!`,{from:"sistema",origin:"cobranca",titulo:t});
  else APP.template(conv,tpl(COB.eventos.pago.tpl),[c.nome.split(" ")[0],brl(t.valor),t.id],{origin:"cobranca",titulo:t});
}
/* eventos de ciclo de vida do título vindos da sincronia com a Digital Grid */
function eventoTitulo(t,tipo){
  const c=contato(t.c),conv=ensureConv(c),ev=COB.eventos[tipo];
  if(tipo==="cancelado"){t.status="cancelado";log("gw","Sincronia Digital Grid · CHARGE_CANCELED",{event:"CHARGE_CANCELED",external_reference:t.id,canceled_at:new Date(now()).toISOString()});log("app",`Régua encerrada para ${t.id}: cobrança cancelada`)}
  if(tipo==="nf"){t.nf="https://nf.performaenergy.com.br/"+t.id.toLowerCase()+".pdf";log("gw","Sincronia Digital Grid · INVOICE_ISSUED",{event:"INVOICE_ISSUED",external_reference:t.id,pdf_url:t.nf,xml_url:t.nf.replace(".pdf",".xml")})}
  if(!ev.ativo){log("app",`Envio de ${tipo==="nf"?"nota fiscal":"cancelamento"} desativado na configuração`);return}
  if(!fin(c,"cobranca")){log("app",`${t.id}: sem consentimento para cobrança, aviso não enviado`);return}
  const params=tipo==="nf"?[c.nome.split(" ")[0],t.id,t.nf.replace("https://","")]:[c.nome.split(" ")[0],t.id];
  APP.template(conv,tpl(ev.tpl),params,{origin:"cobranca",titulo:t});
}

/* condições na ordem obrigatória: à vista → cartão (menor → maior) → boleto (menor → maior) */
const faixaDe=(lista,v)=>lista.find(f=>f.ate==null||v<f.ate);
function cascata(principal,total){
  const O=[];
  O.push(POL.aVistaIsenta?{tipo:"avista",n:1,valor:principal,parcela:principal,isencao:total-principal,auto:true}:{tipo:"avista",n:1,valor:total,parcela:total,isencao:0,auto:true});
  const fc=faixaDe(POL.cartao,total);
  for(let k=fc.min;k<=fc.max;k++){const p=total/k;O.push({tipo:"cartao",n:k,valor:total,parcela:p,auto:k<=POL.cartaoAlcada,bloq:p<POL.parcelaMin})}
  const fb=faixaDe(POL.boleto,total);
  for(let k=fb.min;k<=Math.min(fb.max,POL.boletoMax);k++){const p=total/k;O.push({tipo:"boleto",n:k,valor:total,parcela:p,auto:true,bloq:p<POL.parcelaMin,mesSeguinte:!!fb.mesSeguinte})}
  return O;
}

  if(o.tipo==="cartao") return `${o.n}x de ${brl(o.parcela)} no cartão de crédito`;
  return o.n===1?`boleto único de ${brl(o.valor)}${o.mesSeguinte?" com vencimento no mês que vem":""}`:`${o.n}x de ${brl(o.parcela)} no boleto`;

function resumoCaso(conv,c,motivo){
  const u=ucOf(c),d=dividaDe(c),a=conv.agc||{};
  const L=[`Cliente: ${c.nome} · UC ${u.uc} · ${u.tipoDoc} ${u.doc}`,
    `Contrato: ${u.contrato.status}${u.cancel?` · cancelamento pedido em ${u.cancel.data} (${u.cancel.status})`:""}`,
    d.titulos.length?`Débito: ${brl(d.principal)} (${brl(d.total)} com encargos) em ${d.titulos.length} fatura(s) · ${d.maxDias} dias de atraso`:"Sem faturas vencidas",
    `Perfil: ${PERFIL_LABEL[a.perfil]||"não identificado"}`,
    `Motivo da transferência: ${motivo}`];
  if(a.recusas?.length) L.push(`Condições recusadas: ${a.recusas.map(ofertaCurta).join(", ")}`);
  if(a.cont) L.push(`Contestação: ${a.cont.code} ${CONT[a.cont.code].nome} · "${a.cont.relato}"`);
  const f=flagsHistorico(c); if(f.length) L.push(`Histórico: ${f.join("; ")}`);
  const ac=u.acordos.find(x=>x.status==="aguardando formalização"); if(ac) L.push(`Aceite registrado: ${ac.desc} em ${new Date(ac.em).toLocaleString("pt-BR")} · formalizar`);
  const pr=u.promessas.find(x=>x.status==="vigente"); if(pr) L.push(`Promessa: ${brl(pr.valor)} até ${ddmm(pr.data)}`);
  L.push(`Próximo passo sugerido: ${a.sugestao||"avaliar o caso e retornar ao cliente"}`);
  return L.join("\n");
}

/* ---------- registros ---------- */
const APROV=[]; let aprSeq=1, acSeq=101, prSeq=1, ctSeq=1;
const TAREFAS=[];   // lembretes e verificações de promessas e parcelas
function registrarPromessa(c,valor,data,faturas,canal){
  const u=ucOf(c),p={id:"PR-"+String(prSeq++).padStart(4,"0"),valor,data,faturas,canal,status:"vigente",em:now()};
  u.promessas.push(p);hist(c,`Promessa de pagamento: ${brl(valor)} até ${ddmm(data)} (${canal})`);
  TAREFAS.push({tipo:"lembrete",quando:atHour(data-D,"09:00"),c:c.id,ref:p.id},{tipo:"verificar",quando:atHour(data+D,"09:00"),c:c.id,ref:p.id});
  log("app",`Promessa ${p.id} registrada · régua suspensa até ${ddmm(data)} · lembrete em ${ddmm(data-D)}`);
  return p;
}
function abrirContestacao(conv,c,code,relato){
  const u=ucOf(c),d=dividaDe(c);
  const x={id:"CT-"+String(ctSeq++).padStart(4,"0"),code,relato,status:"aberta",em:now(),canal:"WhatsApp",
    dados:{faturas:d.titulos.map(t=>t.id),valor:d.total,creditos:{...u.cred},contrato:u.contrato.status}};
  u.cont.push(x);conv.agc.cont=x;hist(c,`Contestação ${x.id} aberta: ${code} ${CONT[code].nome}`);
  log("app",`Contestação ${x.id} (${code}) registrada com faturas, créditos e contrato anexados · régua suspensa`);
  return x;
}
function pedirAprovacao(conv,c,tipo,desc,extra){
  const a={id:"AP-"+String(aprSeq++).padStart(3,"0"),c:c.id,conv:conv.id,tipo,desc,status:"pendente",em:now(),...extra};
  APROV.unshift(a);hist(c,`Pedido de aprovação: ${desc}`);log("app",`Aprovação ${a.id} pedida ao time de Cobrança: ${desc}`);
  return a;
}
const suspensa=t=>{const c=contato(t.c),u=ucOf(c);return u.promessas.some(p=>p.status==="vigente"&&p.faturas.includes(t.id))||u.cont.some(x=>x.status==="aberta"&&x.dados.faturas.includes(t.id))};

/* ---------- motor da conversa ---------- */
const AGC={};
const SIM_RE=/^(sim|s|consigo|pode ser|aceito|fechado|ok|quero|tenho|claro|beleza|isso)\b/i;
const NAO_RE=/^(não|nao|n)\b|não consigo|nao consigo|não dá|nao da|sem condiç|não tenho|nao tenho|recuso/i;
function lerPrazo(t){
  t=t.toLowerCase();let m;
  if(/amanh/.test(t)) return 1;
  if((m=t.match(/(?:daqui|em|até)\s*(\d{1,2})\s*dias?/))) return +m[1];
  if((m=t.match(/dia\s*(\d{1,2})/))){const hoje=new Date(now()),alvo=new Date(hoje.getFullYear(),hoje.getMonth(),+m[1],12);if(alvo<hoje)alvo.setMonth(alvo.getMonth()+1);return Math.ceil((alvo-hoje)/D)}
  const dias=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];const i=dias.findIndex(d=>t.includes(d));
  if(i>=0){const h=new Date(now()).getDay();return ((i-h+7)%7)||7}
  if(/próxima semana|semana que vem/.test(t)) return 7;
  if(/fim do mês|final do mês/.test(t)){const h=new Date(now());return new Date(h.getFullYear(),h.getMonth()+1,0).getDate()-h.getDate()||1}
  return null;
}
function intencao(t,p){
  const x=t.toLowerCase();
  if(p&&p.startsWith("AGC:")) return p.slice(4);
  if(/process|procon|aneel|advogad|justiça|justica|judicial|reclame aqui|indeniza|juizado/.test(x)) return "juridico";
  if(/atendente|humano|pessoa|gerente/.test(x)) return "humano";
  if(contCode(x)) return "contesta";
  if(lerPrazo(x)!=null&&/pag|consigo|posso|dia|amanh|semana|mês/.test(x)) return "prazo";
  if(/negoci|parcel|acordo|proposta|desconto|dividir/.test(x)) return "negociar";
  if(/sem dinheiro|desempreg|difícil|dificuldade|apertad|não tenho como|sem condiç|não consigo pagar|nao consigo pagar/.test(x)) return "dificuldade";
  if(/não recebi|nao recebi|não chegou|nao chegou|segunda via|2ª via|2a via|boleto|pix|código de barras|codigo de barras/.test(x)) return "nao_recebeu";
  if(/não entendi|nao entendi|não entendo|de onde|por que (veio|esse valor|está)|composição|explica/.test(x)) return "nao_entendeu";
  if(/titularidade|mudei|mudança|vendi|novo dono/.test(x)) return "titularidade";
  if(/cancel/.test(x)) return "cancelamento";
  if(/não vou pagar|nao vou pagar|não quero pagar|nao quero pagar|me recuso|não pago/.test(x)) return "nao_quer";
  if(/absurd|ridícul|ridicul|palhaç|vergonha|lixo|roubo|ladr|merda|porra|!!!/.test(x)||(t.length>12&&t===t.toUpperCase()&&/[A-Z]/.test(t))) return "irritado";
  return null;
}
const B=(id,title)=>({id:"AGC:"+id,title});
AGC.say=(conv,txt)=>APP.text(conv,txt,{from:"bot"});
AGC.ask=(conv,txt,btns)=>{const a=conv.agc;a.qid=(a.qid||0)+1;a.lastAsk={txt,btns};
  APP.buttons(conv,txt,btns.map(b=>({id:b.id.replace(/^AGC:/,`AGC:q${a.qid}:`),title:b.title})),{from:"bot"})};
AGC.reask=conv=>{const a=conv.agc;if(a.lastAsk)AGC.ask(conv,a.lastAsk.txt,a.lastAsk.btns)};
/* valor que o cliente diz conseguir pagar por mês: "consigo 300 por mês", "R$ 250" */
function lerValor(x){const m=x.match(/r\$\s*([\d.]+(?:,\d{1,2})?)|([\d.]+(?:,\d{1,2})?)\s*(?:reais|por m[eê]s|\/m[eê]s|mensais|mensal|ao m[eê]s|de parcela)/i);if(!m)return null;
  const v=parseFloat((m[1]||m[2]).replace(/\.(?=\d{3})/g,"").replace(",","."));return v>0&&v<1e6?v:null}
AGC.transferir=(conv,c,motivo,sugestao,equipe="Cobrança")=>{
  conv.agc.sugestao=sugestao||conv.agc.sugestao;
  const resumo=resumoCaso(conv,c,motivo);
  conv.resumo=resumo;conv.msgs.push({dir:"note",text:"Resumo do agente de cobrança\n"+resumo,ts:now()});
  hist(c,`Transferido para ${equipe}: ${motivo}`);
  const fora=!dentroHorarioHumano();
  handoff(conv,equipe,motivo,fora?`Registrei tudo o que conversamos. Nosso time atende de segunda a sexta, das ${POL.horaIni} às ${POL.horaFim}, e um atendente vai continuar daqui sem você precisar repetir nada.`:`Vou passar seu atendimento para uma pessoa do time de ${equipe}. Ela já vai receber o resumo do seu caso, então você não vai precisar repetir nada.`);
  return {end:"transferida"};
};
AGC.step=(conv,c,input)=>{
  if(!input||!conv.agc||conv.agc.fim){
    const tx=conv.agcIntent?"":(conv.flow?.textoInicial||conv.lastText||"");const it0=conv.agcIntent||intencao(tx,"");
    conv.agc={fase:"inicio",perfil:null,recusas:[],ofertas:null,i:0,irrit:0,cont:null,fim:false,intentInicial:it0&&!["irritado"].includes(it0)?it0:null,textoInicial:tx};
    conv.agcIntent=null;
    log("app",`Agente de cobrança iniciado para ${c.nome}`);
    return AGC.inicio(conv,c);
  }
  const a=conv.agc, t=(input.text||"").trim();let p=input.payload||"";
  const mq=p.match(/^AGC:(q\d+):(.+)$/);
  if(mq){
    if(mq[1]!=="q"+a.qid){log("app",`Botão de uma pergunta anterior (${mq[2]}) ignorado: a resposta só vale para a pergunta atual`);
      AGC.say(conv,"Esse botão era de uma mensagem anterior. Para não registrar nada errado, vou repetir a pergunta atual.");AGC.reask(conv);return {wait:true}}
    p="AGC:"+mq[2];
  }
  const it=intencao(t,p);
  /* gatilhos que valem em qualquer fase */
  if(it==="juridico"){hist(c,`Manifestação registrada: "${t}"`);a.sugestao="tratar com cuidado jurídico; não discutir mérito pelo WhatsApp";return AGC.transferir(conv,c,"cliente mencionou processo, PROCON, ANEEL ou medida judicial")}
  if(it==="humano") return AGC.transferir(conv,c,"cliente pediu atendimento humano");
  if(it==="irritado"){a.irrit++;
    if(a.irrit>=2) return AGC.transferir(conv,c,"cliente muito insatisfeito","retomar com escuta ativa antes de falar em valores");
    AGC.say(conv,"Entendo sua insatisfação e quero resolver isso com você. Me conta o que aconteceu com essa cobrança?");return {wait:true}}
  if(!it&&!p&&foraDoEscopo(t)){a.fora=(a.fora||0)+1;hist(c,`Mensagem fora do escopo (AG-78): "${t}"`);
    if(a.fora>=ESCOPO.limite) return AGC.transferir(conv,c,"cliente insistiu em assuntos fora do escopo","retomar a conversa sobre a fatura");
    if(a.lastAsk){AGC.say(conv,ESCOPO.resposta+" Voltando à sua fatura:");AGC.reask(conv)}else AGC.say(conv,ESCOPO.resposta+" Posso te ajudar com a sua fatura?");
    return {wait:true}}
  a.fora=0;
  if(a.fase!=="contestacao"&&a.fase!=="comprovante"&&it==="contesta") return AGC.contestar(conv,c,contCode(t.toLowerCase()),t);
  const fn=AGC.fases[a.fase]; if(fn) return fn(conv,c,t,p,it);
  return AGC.motivo(conv,c,t,p,it);
};
AGC.inicio=(conv,c)=>{
  const a=conv.agc, u=ucOf(c), d=dividaDe(c);
  if(c.tags.includes("novo")&&!c.vinculo){a.fase="identificar";
    AGC.say(conv,"Olá! Não encontrei seu número no nosso cadastro. Para localizar, me informa o CPF ou CNPJ do titular, o número da unidade consumidora (UC) ou o e-mail cadastrado?");return {wait:true}}
  hist(c,"Atendimento com o agente de cobrança");
  if(a.intentInicial==="juridico"){hist(c,`Manifestação registrada: "${a.textoInicial}"`);return AGC.transferir(conv,c,"cliente mencionou processo, PROCON, ANEEL ou medida judicial")}
  if(a.intentInicial==="humano") return AGC.transferir(conv,c,"cliente pediu atendimento humano");
  if(a.intentInicial) return AGC.rota(conv,c,a.intentInicial,a.textoInicial||"");
  if(!d.titulos.length){
    a.fase="motivo";
    const ac=u.acordos.find(x=>x.status==="aguardando formalização"||x.status==="formalizado"),pr=u.promessas.find(x=>x.status==="vigente"),cf=TITULOS.some(t=>t.c===cid(c)&&t.status==="conferencia");
    const andamento=ac?` Seu acordo ${ac.id} (${ac.desc}) está ${ac.status==="formalizado"?"formalizado":"aguardando formalização pelo nosso time"}.`:pr?` Sua promessa de pagamento de ${brl(pr.valor)} vence em ${ddmm(pr.data)}.`:cf?" Seu pagamento está em conferência pelo financeiro.":"";
    APP.list(conv,`${pn(c)}, localizei seu cadastro (UC ${u.uc}) e não há faturas vencidas em aberto.${andamento} Em que posso ajudar?`,"Ver opções",[
      {id:"AGC:nao_recebeu",title:"2ª via de fatura",description:"Boleto, Pix, código de barras, PDF"},{id:"AGC:nao_entendeu",title:"Entender minha fatura",description:"kWh, tarifa e créditos"},
      {id:"AGC:cancelamento",title:"Cancelamento",description:"Saldo, multa e prazo"},{id:"AGC:titularidade",title:"Troca de titularidade",description:"Como fazer na CEMIG"}],{from:"bot"});
    return {wait:true};
  }
  a.fase="motivo";
  APP.list(conv,`${pn(c)}, localizei ${d.titulos.length} fatura(s) vencida(s) na UC ${u.uc}, somando ${brl(d.principal)}. A mais antiga está com ${d.maxDias} dias de atraso. Aconteceu alguma coisa que dificultou o pagamento?`,"Responder",[
    {id:"AGC:nao_recebeu",title:"Não recebi o boleto",description:"Envio a 2ª via agora"},{id:"AGC:nao_entendeu",title:"Não entendi a cobrança",description:"Explico de onde veio o valor"},
    {id:"AGC:dificuldade",title:"Estou sem condições",description:"Vemos uma alternativa"},{id:"AGC:negociar",title:"Quero negociar",description:"Condições para regularizar"},
    {id:"AGC:ja_pagou",title:"Já paguei",description:"Confiro o pagamento"},{id:"AGC:contesta",title:"Discordo da cobrança",description:"Registro sua contestação"}],{from:"bot"});
  return {wait:true};
};
AGC.motivo=(conv,c,t,p,it)=>{
  if(!it){conv.agc.tentId=(conv.agc.tentId||0)+1;
    if(conv.agc.tentId>=3) return AGC.transferir(conv,c,"agente não entendeu o pedido após 3 tentativas");
    AGC.say(conv,"Quero entender melhor para te ajudar. Você não recebeu o boleto, não entendeu o valor, está sem condições de pagar agora ou quer negociar?");return {wait:true}}
  return AGC.rota(conv,c,it,t);
};
AGC.rota=(conv,c,it,t)=>{
  const a=conv.agc;
  switch(it){
    case "nao_recebeu": return AGC.segundaVia(conv,c);
    case "nao_entendeu": a.perfil=a.perfil||"nao_entendeu"; return AGC.explicar(conv,c);
    case "dificuldade": a.perfil="nao_consegue"; return AGC.perguntaAVista(conv,c,"Entendo, e obrigado por me contar. Para eu buscar a melhor alternativa:");
    case "negociar": return AGC.perguntaAVista(conv,c,"Vamos encontrar uma condição que caiba para você.");
    case "ja_pagou": return AGC.contestar(conv,c,"CONT-08",t||"Cliente informou que já pagou");
    case "contesta": return t&&contCode(t.toLowerCase())?AGC.contestar(conv,c,contCode(t.toLowerCase()),t):(a.fase="contestacao_motivo",AGC.say(conv,"Certo, vou registrar. Me explica o que não está correto nessa cobrança?"),{wait:true});
    case "prazo": return AGC.prazo(conv,c,t);
    case "cancelamento": return AGC.cancelamento(conv,c);
    case "titularidade": return AGC.titularidade(conv,c);
    case "nao_quer": return AGC.naoQuer(conv,c);
  }
  return AGC.motivo(conv,c,t,"",null);
};
/* 2) não recebeu o boleto: confirma cadastro → forma de pagamento → confirma acesso */
AGC.segundaVia=(conv,c)=>{
  const u=ucOf(c);conv.agc.fase="cadastro";
  AGC.ask(conv,`Antes de enviar, me confirma se seus dados estão certos? Assim evitamos que os próximos boletos se percam.\nNome: ${c.nome}\nE-mail: ${u.email}\nTelefone: ${c.tel}`,[B("dados_ok","Estão corretos"),B("dados_corrigir","Corrigir e-mail")]);
  return {wait:true};
};
AGC.formas=(conv,c)=>{
  conv.agc.fase="forma";
  APP.list(conv,"Como prefere receber a 2ª via?","Escolher",[
    {id:"AGC:via_pix",title:"Pix copia e cola",description:"Compensa na hora"},{id:"AGC:via_barras",title:"Código de barras",description:"Para pagar no app do banco"},
    {id:"AGC:via_pdf",title:"PDF da fatura",description:"Documento completo"},{id:"AGC:via_cartao",title:"Link de cartão",description:"Pagamento com cartão de crédito"}],{from:"bot"});
  return {wait:true};
};
AGC.enviarVia=(conv,c,forma)=>{
  const d=dividaDe(c), ts=d.titulos.length?d.titulos:TITULOS.filter(t=>t.c===cid(c)&&t.status==="aberto").slice(0,1);
  ts.forEach(t=>{
    if(forma==="via_pix") AGC.say(conv,pixText(t));
    if(forma==="via_barras") AGC.say(conv,`Fatura ${t.id} · ${brl(encargos(t).total)}\nCódigo de barras:\n${"34191.79001 01043.510047 91020.150008 "+Math.floor(Math.random()*9)+" "+String(9000+Math.round(t.valor*100)).padStart(14,"0")}`);
    if(forma==="via_pdf") APP.post(conv,{messaging_product:"whatsapp",recipient_type:"individual",to:toOf(c),type:"document",document:{link:`https://cdn.performaenergy.com.br/faturas/${t.id}.pdf`,filename:`fatura_${t.id}.pdf`,caption:`Fatura ${t.id} · ${brl(t.valor)}`}},{text:`[documento] fatura_${t.id}.pdf`},{from:"bot",origin:"cobranca"});
    if(forma==="via_cartao") AGC.say(conv,`Link para pagar a fatura ${t.id} no cartão: https://pay.performaenergy.com.br/${t.id.toLowerCase()}-${hex(6)}`);
  });
  hist(c,`2ª via enviada (${{via_pix:"Pix",via_barras:"código de barras",via_pdf:"PDF",via_cartao:"link de cartão"}[forma]})`);
  conv.agc.fase="acesso";
  AGC.ask(conv,"Conseguiu abrir e acessar o documento?",[B("acesso_ok","Consegui"),B("acesso_nok","Não consegui")]);
  return {wait:true};
};
/* 3) não entende a cobrança: explica com dados reais antes de pedir pagamento */
AGC.explicar=(conv,c)=>{
  const d=dividaDe(c), ts=d.titulos.length?d.titulos:TITULOS.filter(t=>t.c===cid(c)&&t.status!=="pago").slice(0,1);
  if(!ts.length){AGC.say(conv,"Não encontrei faturas em aberto para explicar. Quer que eu detalhe a última fatura paga?");conv.agc.fase="motivo";return {wait:true}}
  ts.slice(0,3).forEach(t=>AGC.say(conv,composicao(t,c)));
  hist(c,"Composição da cobrança explicada (kWh, tarifa, créditos e encargos)");
  if(!d.titulos.length){conv.agc.fase="fim_duvida";AGC.ask(conv,"Ficou claro de onde veio o valor?",[B("claro","Ficou claro"),B("duvida","Ainda tenho dúvida")]);return {wait:true}}
  return AGC.perguntaAVista(conv,c,"Ficou claro de onde veio o valor?",[B("avista_sim","Consigo à vista"),B("avista_nao","Não consigo"),B("duvida","Ainda tenho dúvida")]);
};
/* negociação: sempre em forma de pergunta, uma condição por vez */
AGC.perguntaAVista=(conv,c,intro,btns)=>{
  const a=conv.agc, d=dividaDe(c);
  if(!d.titulos.length){AGC.say(conv,"Você não tem faturas vencidas no momento. Posso ajudar em mais alguma coisa?");a.fase="motivo";return {wait:true}}
  const f=flagsHistorico(c);
  if(POL.transferirSeHistorico&&f.length){a.sugestao="consultar o histórico antes de propor nova condição";return AGC.transferir(conv,c,`histórico de negociação: ${f.join("; ")}`)}
  a.ofertas=cascata(d.principal,d.total);a.i=0;a.recusas=[];
  const o=a.ofertas[0];a.fase="negociacao";
  AGC.ask(conv,`${intro} Você tem condições de fazer o ${ofertaTxt(o)}?`,btns||[B("avista_sim","Sim, consigo"),B("avista_nao","Não consigo"),B("outra_data","Preciso de prazo")]);
  return {wait:true};
};
AGC.proximaOferta=(conv,c)=>{
  const a=conv.agc, atual=a.ofertas[a.i];a.recusas.push(atual);
  hist(c,`Recusou: ${ofertaTxt(atual)}`);
  const motivoPulo=z=>z.bloq?`parcela de ${brl(z.parcela)} abaixo do mínimo de ${brl(POL.parcelaMin)}`:(a.semCartao||a.pularCartao)&&z.tipo==="cartao"?"cliente não usa cartão":a.capacidade&&z.parcela>a.capacidade+0.005?`parcela de ${brl(z.parcela)} acima da capacidade informada (${brl(a.capacidade)})`:null;
  let j=a.i+1;while(j<a.ofertas.length&&motivoPulo(a.ofertas[j])){const mo=motivoPulo(a.ofertas[j]);log("app",`Pulado ${ofertaCurta(a.ofertas[j])}: ${mo}`);if(!a.ofertas[j].bloq)hist(c,`Condição ${ofertaCurta(a.ofertas[j])} não oferecida: ${mo}`);j++}
  if(j>=a.ofertas.length){
    if(a.capacidade){const d=dividaDe(c);
      if(a.capacidade<POL.parcelaMin){AGC.say(conv,`A menor parcela que a política permite é de ${brl(POL.parcelaMin)}. Um valor de ${brl(a.capacidade)} por mês precisa ser avaliado por uma pessoa do time.`);return AGC.transferir(conv,c,`pedido fora da política: parcela de ${brl(a.capacidade)} abaixo do mínimo`,"avaliar exceção")}
      const k=Math.ceil(d.total/a.capacidade),tipo=a.semCartao||a.pularCartao?"boleto":"cartao";
      const of={tipo,n:k,valor:d.total,parcela:d.total/k,auto:false};
      const ap=pedirAprovacao(conv,c,"parcelamento",`${ofertaCurta(of)} de ${brl(of.parcela)} para ${c.nome} (${brl(d.total)}): fora das faixas da política, pela capacidade de ${brl(a.capacidade)}/mês`,{oferta:of});
      a.fase="aguardando_aprovacao";a.aprov=ap.id;a.ofertas.push(of);a.i=a.ofertas.length-1;
      AGC.say(conv,`Dentro das regras eu não chego numa parcela de até ${brl(a.capacidade)}. Pedi ao setor financeiro para avaliar ${k}x de ${brl(of.parcela)} e te retorno aqui. Ficou alguma dúvida enquanto isso?`);
      return {wait:true};
    }
    return AGC.esgotado(conv,c);
  }
  a.i=j;const o=a.ofertas[j];
  if(!o.auto){
    const ap=pedirAprovacao(conv,c,"parcelamento",`${ofertaCurta(o)} para ${c.nome} (${brl(o.valor)}), acima da alçada do agente (${POL.cartaoAlcada}x)`,{oferta:o});
    a.fase="aguardando_aprovacao";a.aprov=ap.id;
    AGC.say(conv,`Para chegar em ${o.n}x preciso da liberação do setor financeiro. Já pedi e te retorno aqui assim que responderem. Enquanto isso, ficou alguma dúvida sobre os valores?`);
    return {wait:true};
  }
  const pre=a.notaBoleto&&o.tipo==="cartao"?"Antes do boleto, a política pede que eu te apresente o cartão de crédito. ":a.notaPasso?"As condições são liberadas uma por vez. ":a.capacidade?`Considerando os ${brl(a.capacidade)} por mês que você me disse: `:"";a.notaBoleto=false;a.notaPasso=false;
  let frase=pre+(atual.tipo!==o.tipo&&o.tipo==="cartao"?`Entendi. Posso parcelar no cartão de crédito: ${o.n}x de ${brl(o.parcela)}.`
    :atual.tipo!==o.tipo&&o.tipo==="boleto"?`Entendi. Tenho mais uma alternativa, no boleto: ${o.n===1?`pagamento único de ${brl(o.valor)}${o.mesSeguinte?" com vencimento no mês que vem":""}`:`${o.n}x de ${brl(o.parcela)}`}.`
    :`Entendi. Consigo ${o.tipo==="cartao"?`${o.n}x de ${brl(o.parcela)} no cartão`:`${o.n}x de ${brl(o.parcela)} no boleto`}.`);
  if(pre)frase=pre+frase.slice(pre.length).replace(/^Entendi\. /,"");
  AGC.ask(conv,`${frase} Essa condição funciona para você?`,[B("aceita","Aceito"),B("recusa","Não consigo"),B("outra_data","Preciso de prazo")]);
  return {wait:true};
};
AGC.aceitar=(conv,c)=>{
  const a=conv.agc,o=a.ofertas[a.i],d=dividaDe(c),u=ucOf(c);
  const ac={id:"AC-0"+(acSeq++),c:c.id,faturas:d.titulos.map(t=>t.id),oferta:o,desc:ofertaTxt(o),status:"aguardando formalização",em:now(),canal:"WhatsApp",
    condicoes:`${ofertaTxt(o)}. Em caso de descumprimento, multa e juros voltam a incidir sobre o valor não pago.`};

AGC.esgotado=(conv,c)=>{

/* 7) prazo: dentro da autonomia vira promessa; fora, alternativa ou aprovação */
AGC.prazo=(conv,c,t)=>{
  const a=conv.agc,dias=lerPrazo(t),d=dividaDe(c);
  if(dias==null){a.fase="prazo_qual";AGC.say(conv,"Claro. Em qual data você consegue fazer o pagamento?");return {wait:true}}
  const data=atHour(now()+dias*D,"12:00");
  if(dias<=POL.prazoAutonomiaDias){
    const pr=registrarPromessa(c,dias<=POL.aVistaPrazoDias&&POL.aVistaIsenta?d.principal:d.total,data,d.titulos.map(x=>x.id),"WhatsApp");
    AGC.say(conv,`Combinado: registrei o pagamento de ${brl(pr.valor)} até ${ddmm(data)}${pr.valor<d.total?", já com a isenção de juros e multa":""}. Um dia antes, ${ddmm(data-D)}, te mando um lembrete. Até lá não vou te cobrar de novo. Posso te enviar o Pix ou o boleto agora para deixar agendado?`);
    a.fase="pos_promessa";conv.agc.fim=false;return {wait:true};
  }
  const lim=ddmm(now()+POL.prazoAutonomiaDias*D);
  a.fase="prazo_fora";a.prazoPedido=data;
  AGC.ask(conv,`Esse prazo passa do que consigo aprovar sozinho. Consigo registrar o pagamento até ${lim}. Funciona? Se não, peço aprovação ao financeiro para ${ddmm(data)}.`,[B("prazo_lim",`Até ${lim}`),B("prazo_aprov","Pedir aprovação")]);
  return {wait:true};
};
/* 4) contestação: classifica, tenta esclarecer com dados validados ou transfere */

  switch(code){

    case "CONT-07": return AGC.titularidade(conv,c,true);
    case "CONT-05": return AGC.cancelamento(conv,c,true);

    case "CONT-02": case "CONT-03": return esclarecer(d.titulos.map(t=>composicao(t,c)).join("\n\n")||"Não encontrei faturas vencidas.");
    case "CONT-11": {const dup=TITULOS.filter(t=>t.c===cid(c)).reduce((m,t)=>(m[t.competencia||"?"]=(m[t.competencia||"?"]||0)+1,m),{});const tem=Object.values(dup).some(v=>v>1);
      if(tem) return AGC.transferir(conv,c,"possível duplicidade confirmada no sistema");return esclarecer("Conferi: cada fatura em aberto é de uma competência diferente, então não há cobrança em duplicidade.");}
    case "CONT-12": return esclarecer("A IVI Energia é parceira da Performa Energy e emite parte das faturas da operação. A cobrança é referente à energia creditada na sua UC.");
  }

AGC.cancelamento=(conv,c,deContestacao)=>{

/* decisão humana sobre aprovações: o agente retoma a conversa */
function decidirAprovacao(id,ok){
  const ap=APROV.find(x=>x.id===id); if(!ap||ap.status!=="pendente") return;
  ap.status=ok?"aprovada":"negada";ap.por=ME.nome;ap.decididoEm=now();
  const c=contato(ap.c),conv=CONVS.find(x=>x.id===ap.conv);
  hist(c,`Aprovação ${ap.id} ${ap.status} por ${ME.nome}`);log("app",`Aprovação ${ap.id} ${ap.status} por ${ME.nome}`);
  if(ok&&ap.tipo==="parcelamento") ucOf(c).excecao=true;
  if(!conv) return;
  if(conv.status!=="bot"||!conv.agc||conv.agc.aprov!==ap.id){
    APP.text(conv,ok?`${pn(c)}, o financeiro liberou: ${ap.oferta?ofertaTxt(ap.oferta):"pagamento até "+ddmm(ap.data)}. Posso registrar?`:`${pn(c)}, o financeiro não liberou essa condição. Vou te mostrar as alternativas disponíveis.`,{from:"agente"});return;
  }
  const a=conv.agc;
  if(ap.tipo==="parcelamento"){
    if(ok){a.fase="negociacao";const ix=a.ofertas.indexOf(ap.oferta);if(ix>=0)a.i=ix;AGC.ask(conv,`Consegui a liberação: ${ofertaTxt(ap.oferta)}. Posso registrar?`,[B("aceita","Aceito"),B("recusa","Não consigo")]);}
    else {AGC.say(conv,`O financeiro não liberou ${ap.oferta.n}x.`);a.fase="negociacao";AGC.proximaOferta(conv,c)}
  } else {
    if(ok){const d=dividaDe(c);registrarPromessa(c,d.total,ap.data,d.titulos.map(x=>x.id),"WhatsApp");AGC.say(conv,`Liberado! Registrei o pagamento até ${ddmm(ap.data)}. Te mando um lembrete um dia antes.`);a.fim=true}
    else {a.fase="negociacao";AGC.perguntaAVista(conv,c,`O financeiro não liberou o prazo até ${ddmm(ap.data)}.`)}
  }
}
/* formalização humana do acordo (requisito 8) */
function formalizarAcordo(acId){
  for(const k in UCS){const ac=UCS[k].acordos.find(a=>a.id===acId);if(!ac)continue;
    const c=contato(+k),conv=ensureConv(c),o=ac.oferta;
    const parcelas=Array.from({length:o.n},(_,i)=>({n:i+1,valor:o.parcela,venc:atHour(now()+(o.tipo==="avista"?POL.aVistaPrazoDias:(o.mesSeguinte?30:i*30+5))*D,"12:00")}));
    ac.status="formalizado";ac.formalizadoPor=ME.nome;ac.formalizadoEm=now();ac.parcelas=parcelas;
    log("req","POST digitalgrid · acordos/importar (substitui a planilha Excel)",{cliente:UCS[k].doc,uc:UCS[k].uc,faturas:ac.faturas,modalidade:o.tipo,parcelas:parcelas.map(p=>({numero:p.n,valor:+p.valor.toFixed(2),vencimento:isoDay(p.venc)}))},"Authorization: Bearer (integração Digital Grid)");
    log("res","HTTP 201 · boletos gerados",{acordo:ac.id,boletos:parcelas.map(p=>"bol_"+hex(8))});
    log("req","POST plog · clientes/"+UCS[k].doc.replace(/\D/g,"")+"/documentos",{tipo:"aceite_acordo",acordo:ac.id,canal:ac.canal,aceite_em:new Date(ac.em).toISOString(),condicoes:ac.condicoes},"Authorization: Bearer (integração Plog)");
    parcelas.forEach(p=>TAREFAS.push({tipo:"lembrete_parcela",quando:atHour(p.venc-D,"09:00"),c:c.id,ref:ac.id,parcela:p.n}));
    hist(c,`Acordo ${ac.id} formalizado por ${ME.nome}: ${ac.desc}`);
    const txt=`${pn(c)}, seu acordo ${ac.id} está formalizado:\n${parcelas.map(p=>`${p.n}/${o.n} · ${brl(p.valor)} · vence ${ddmm(p.venc)}`).join("\n")}\n${o.tipo==="cartao"?"Link de pagamento: https://pay.performaenergy.com.br/"+ac.id.toLowerCase():o.tipo==="avista"?pixText({id:ac.faturas.join("+"),valor:o.valor}):"Os boletos chegam também no seu e-mail."}`;
    if(janela(conv)>0) APP.text(conv,txt,{from:"agente",origin:"cobranca"}); else APP.template(conv,tpl("t2"),[pn(c),"acordo "+ac.id,ddmm(parcelas[0].venc)],{origin:"cobranca"});
    if(UCS[k].neg==="concluída") TAREFAS.push({tipo:"tirar_negativacao",quando:parcelas[0].venc+D,c:c.id,ref:ac.id});
    return ac;
  }
}

function emailRecebido(c){

/* tarefas: lembretes de promessa/parcela e verificação de promessa vencida */
setInterval(()=>{
  let mudou=false;
  TAREFAS.filter(x=>!x.feito&&x.quando<=now()).forEach(x=>{
    x.feito=true;mudou=true;const c=contato(x.c),u=ucOf(c),conv=ensureConv(c);
    if(x.tipo==="lembrete"||x.tipo==="lembrete_parcela"){const pr=u.promessas.find(p=>p.id===x.ref);
      if(x.tipo==="lembrete"&&pr?.status!=="vigente")return;
      APP.template(conv,tpl("t1"),[pn(c),x.tipo==="lembrete"?"promessa "+x.ref:"acordo "+x.ref,ddmm(now()+D)],{origin:"cobranca"});enviarEmail(c,"Lembrete de pagamento","Seu pagamento combinado vence amanhã.");hist(c,`Lembrete enviado (${x.ref})`)}
    if(x.tipo==="verificar"){const pr=u.promessas.find(p=>p.id===x.ref);if(!pr||pr.status!=="vigente")return;
      const pagas=pr.faturas.every(id=>TITULOS.find(t=>t.id===id)?.status==="pago");
      pr.status=pagas?"cumprida":"quebrada";hist(c,`Promessa ${pr.id} ${pr.status}`);log("app",`Promessa ${pr.id} ${pr.status}${pagas?"":" · cliente volta para a régua de cobrança"}`)}
    if(x.tipo==="tirar_negativacao"){const ac=u.acordos.find(a=>a.id===x.ref);log("req","POST bureau · negativacoes/baixa",{documento:u.doc,acordo:x.ref});u.neg="em dia";hist(c,"Negativação retirada após pagamento do acordo")}
  });
  if(mudou) refresh();
},1000);

  reopen(conv);

  conv.agcIntent=intent;if(conv.flow&&!conv.flow.done){conv.flow.done=true;execFim(conv,"concluída")}
  later(600,()=>ENGINE.start(conv,c,"f1","agente_cob",`resposta de template (${intent})`));
}

  if(items){const atTop=list.scrollTop<10;list.insertAdjacentHTML("afterbegin",items.split("</details>").filter(Boolean).reverse().map(x=>x+"</details>").join(""));if(atTop)list.scrollTop=0}
  conRendered=LOG.length;
}
